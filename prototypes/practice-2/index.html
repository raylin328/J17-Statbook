<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice Prototype 2</title>

<style>
:root{
  --bg:#f4f2ee; --surface:#ffffff; --ink:#1d2430; --ink-2:#5f6b7a; --line:#d9d4cb; --soft:#efebe4; --head:#e9e5dd;
  --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#dcefe8; --warn:#b4471f; --warn-soft:#f7e3da; --gold:#b98a10;
  --good:#2f7d4f; --bad:#b4471f; --sel:#2b6cb0; --sel-soft:#e3eefb;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14181e; --surface:#1d232b; --ink:#e8ecf1; --ink-2:#9aa6b4; --line:#323b46; --soft:#232a33; --head:#262e37;
  --accent:#4fb596; --accent-ink:#0d1a15; --accent-soft:#1f3a31; --warn:#ef8a62; --warn-soft:#3d241a; --gold:#e0b84a;
  --good:#5cc48a; --bad:#ef8a62; --sel:#6aa6e8; --sel-soft:#1e3047; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#14181e; --surface:#1d232b; --ink:#e8ecf1; --ink-2:#9aa6b4; --line:#323b46; --soft:#232a33; --head:#262e37;
  --accent:#4fb596; --accent-ink:#0d1a15; --accent-soft:#1f3a31; --warn:#ef8a62; --warn-soft:#3d241a; --gold:#e0b84a;
  --good:#5cc48a; --bad:#ef8a62; --sel:#6aa6e8; --sel-soft:#1e3047; color-scheme:dark }
*{ box-sizing:border-box }
body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust:100% }
button{ font:inherit; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:10px; min-height:44px; padding:0 14px; cursor:pointer; touch-action:manipulation }
button:disabled{ opacity:.45; cursor:default }
button.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600 }
button.ghost{ background:transparent; border-color:transparent }
button.danger{ color:var(--warn) }
button.armed{ background:var(--warn); color:#fff; border-color:var(--warn) }
button[aria-pressed="true"]{ background:var(--ink); color:var(--surface); border-color:var(--ink) }
input, textarea, select{ font:inherit; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-height:44px; width:100% }
label.f{ display:block; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); margin:12px 0 6px }
.muted{ color:var(--ink-2) } .small{ font-size:13px } .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap } .grow{ flex:1 1 auto; min-width:0 }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px }
.chip{ min-height:38px; padding:0 12px; border-radius:19px; font-size:14px }
.lbl{ font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-2) }
.hint{ border:1px dashed var(--line); border-radius:12px; padding:18px; color:var(--ink-2); text-align:center }
.banner{ background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn); border-radius:10px; padding:10px 12px; font-weight:600 }
.wrap{ max-width:1100px; margin:0 auto }

header.app{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:8px max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); background:var(--surface); border-bottom:1px solid var(--line) }
header.app .brand{ font-weight:700 } header.app .brand small{ font-weight:500; color:var(--ink-2); margin-left:6px }
header.app nav{ display:flex; gap:6px; flex-wrap:wrap; margin-left:auto } header.app nav button{ min-height:40px }
#stamp{ font-size:12px; color:var(--ink-2) } #stamp.bad{ color:var(--warn); font-weight:700 }
main{ padding:12px max(14px, env(safe-area-inset-right, 0px)) 14px max(14px, env(safe-area-inset-left, 0px)) }

/* the sheet */
.sheetview{ display:flex; flex-direction:column; gap:10px; height:calc(100vh - var(--hh, 60px) - 26px); height:calc(100dvh - var(--hh, 60px) - 26px) }
.bar{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; flex:0 0 auto }
.bar .where{ font-weight:700 } .bar .where span{ font-weight:500; color:var(--ink-2) }
.bar .entry{ display:flex; gap:8px; align-items:center }
.bar .entry input{ font-size:19px; min-height:52px; flex:1 1 auto; min-width:0 }
.bar .tools{ display:flex; gap:6px; flex-wrap:wrap; align-items:center }
.bar .tools button{ min-height:40px; padding:0 12px }
.bar .read{ font-size:13.5px; color:var(--ink-2); min-height:20px }
.bar .read b{ color:var(--ink); font-weight:600 }
.swface{ font-variant-numeric:tabular-nums; font-weight:700; min-width:5.2em; text-align:center } .swface:empty{ display:none }
.bar .entry button{ white-space:nowrap }
button.running{ background:var(--warn); color:#fff; border-color:var(--warn) }
.tablebox{ flex:1 1 auto; min-height:0; overflow:auto; border:1px solid var(--line); border-radius:14px; background:var(--surface); -webkit-overflow-scrolling:touch }
table.sheet{ border-collapse:separate; border-spacing:0; font-size:14px }
table.sheet th, table.sheet td{ border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:0; vertical-align:top; background:var(--surface) }
table.sheet thead th{ position:sticky; top:0; z-index:3; background:var(--head) }
table.sheet .pcell{ position:sticky; left:0; z-index:2; background:var(--head) }
table.sheet thead th.pcell{ z-index:4 }
.colh{ display:flex; align-items:stretch; width:180px } .colh button{ border:0; border-radius:0; background:transparent; min-height:48px; text-align:left; padding:6px 10px; font-weight:600; flex:1 1 auto; line-height:1.2 }
.colh button.menu{ flex:0 0 36px; padding:0; color:var(--ink-2); text-align:center }
.colh button[aria-pressed="true"]{ background:var(--sel-soft); color:var(--ink) }
th.addcol button{ border:0; border-radius:0; background:transparent; min-height:48px; padding:0 16px; color:var(--accent); font-weight:700; white-space:nowrap }
.pbtn{ display:block; width:170px; border:0; border-radius:0; background:transparent; text-align:left; padding:8px 10px; min-height:58px }
.pbtn b{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis } .pbtn span{ font-size:12.5px; color:var(--ink-2) }
.cell{ display:block; width:180px; min-height:58px; border:0; border-radius:0; background:transparent; text-align:left; padding:6px 10px; cursor:pointer }
.cell .tx{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word }
.cell .rd{ display:block; font-size:11.5px; color:var(--ink-2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.cell .up{ color:var(--good); font-weight:700 } .cell .down{ color:var(--bad); font-weight:700 } .cell .pb{ color:var(--gold); font-weight:700 }
.cell.na .tx{ color:var(--ink-2); font-style:italic }
td.on .cell{ background:var(--sel-soft); box-shadow:inset 0 0 0 2px var(--sel) }
tr.rowon .pbtn{ background:var(--sel-soft) }
td.addrow{ background:var(--soft) }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:8px; flex:0 0 auto; max-height:46vh; overflow:auto }
.tag{ display:inline-flex; align-items:center; gap:4px; font-size:12.5px; padding:2px 8px; border-radius:12px; background:var(--soft) }
.grid2{ display:grid; grid-template-columns:300px minmax(0,1fr); gap:14px }
.list{ display:flex; flex-direction:column; gap:6px } .list button.item{ text-align:left }
table.t{ border-collapse:collapse; width:100%; font-size:14px } table.t th, table.t td{ border-bottom:1px solid var(--line); padding:8px 6px; text-align:left; vertical-align:top }
table.t th{ font-size:12px; color:var(--ink-2); text-transform:uppercase; letter-spacing:.05em }
.tablewrap{ overflow-x:auto }
.setgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:12px }
.spark{ display:block }
@media (max-width: 1000px){ .grid2{ grid-template-columns:1fr } .sheetview{ height:auto } .tablebox{ max-height:70vh } }
</style>

</head>
<body>
<header class="app" id="hdr"></header>
<main id="view"></main>

<script>
"use strict";
/* ======================================================================
   J17 Stat Book · Practice prototype 2: a spreadsheet that knows basketball.
   Players down the side, drills (columns) across the top, free text in every
   cell, exactly as you'd type it in a sheet. On top of the sheet:
   - every entry is read for numbers and units without needing to know what
     the drill means ("78 in 42.33s", "8 right, 6 left", "7/10", "N/A", "(lost ball)")
   - columns are matched by name across practices, so every cell knows the
     player's last value and best in that column
   - a big entry bar (Enter = next player), a stopwatch and a countdown
   - every keystroke saves; Undo; exports and a sheet import
   ====================================================================== */
var KEY = "j17.statbook.practice-proto2", UIKEY = KEY + ".ui";
var DEFAULT_SCALE = ["Beginner", "Developing", "Intermediate", "Advanced", "Elite"];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function norm(s){ return String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[\s\-_.\/]+/g, " ").trim(); }
function today(){ var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function daysAgo(n){ var d = new Date(Date.now() - n * 864e5); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function h(tag, a, kids){
  var e = document.createElement(tag);
  if(a) Object.keys(a).forEach(function(k){
    var v = a[k]; if(v === null || v === undefined || v === false) return;
    if(k === "class") e.className = v; else if(k === "text") e.textContent = v;
    else if(k === "value") e.value = v; else if(k === "style") e.style.cssText = v;
    else if(k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  });
  (kids || []).forEach(function(c){ if(c === null || c === undefined || c === false) return; e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function fmt(n){ var r = Math.round(n * 100) / 100; return String(r); }

/* ---------------- reading an entry, whatever it means ----------------
   Keeps the text as typed and pulls out: numbers with a unit or a side ("42.33s", "8 right"),
   "of N" ("7/10", "7 of 10"), mixed fractions ("19 1/3"), clock times ("1:05.3"), a level word,
   "not done" (N/A, DNP, absent, out, injured, -), and anything in brackets as a note.
   A count with a time gives a rate per second. */
var UNITS = { s: "s", sec: "s", secs: "s", second: "s", seconds: "s", min: "min", mins: "min", minute: "min", minutes: "min",
  ft: "ft", feet: "ft", foot: "ft", inch: "in", inches: "in", cm: "cm", m: "m", lb: "lb", lbs: "lb", kg: "kg",
  r: "right", right: "right", rt: "right", l: "left", left: "left", lt: "left", rh: "right", lh: "left", pts: "pts", points: "pts" };
var JOIN = { "in": 1, "and": 1, "x": 1, "for": 1, "at": 1, "to": 1, "then": 1, "with": 1, "on": 1, "after": 1 };
function parse(text){
  var out = { nums: [], level: "", status: "", note: "", rate: null };
  var t = String(text == null ? "" : text).trim(); if(!t) return out;
  if(/^(n\/?a|dnp|did ?not|didn'?t|absent|out|inj(ured)?|sick|away|-+|—|–)$/i.test(t)){ out.status = "not done"; return out; }
  var notes = [];
  t = t.replace(/\(([^)]*)\)?/g, function(m, x){ if(x.trim()) notes.push(x.trim()); return " ; "; });
  out.note = notes.join("; ");
  var toks = t.match(/\d+:\d{1,2}(?:\.\d+)?|\d+(?:\.\d+)?\/\d+(?:\.\d+)?|\d*\.\d+|\d+|%|"|'|[A-Za-z][A-Za-z']*|;/g) || [];
  var levelOf = function(w){ var lw = w.toLowerCase(); for(var i = 0; i < DB.scale.length; i++){ var s = DB.scale[i].toLowerCase(); if(lw === s || lw === s.slice(0, 3) || (s === "elite" && lw === "elt")) return DB.scale[i]; } return ""; };
  for(var i = 0; i < toks.length; i++){
    var k = toks[i], n = null;
    if(/^\d+:\d/.test(k)){ var a = k.split(":"); n = { v: parseInt(a[0], 10) * 60 + parseFloat(a[1]), u: "s" }; }
    else if(/\//.test(k)){
      var f = k.split("/"), x = parseFloat(f[0]), y = parseFloat(f[1]), last = out.nums[out.nums.length - 1];
      if(last && !last.u && !last.of && x < y && i > 0 && /^\d+$/.test(toks[i - 1]) && /^\d+$/.test(f[0])){ last.v = last.v + x / y; continue; }   // 19 1/3
      n = { v: x, of: y };
    }
    else if(/^\d|^\./.test(k)) n = { v: parseFloat(k) };
    else if(k !== ";" && !out.level){ var lv = levelOf(k); if(lv) out.level = lv; }
    if(!n) continue;
    var nx = toks[i + 1], nl = nx ? nx.toLowerCase() : "";
    if(nx === "%"){ n.u = "%"; i++; }
    else if(nx === '"'){ n.u = "in"; i++; }
    else if(nx === "'"){ n.u = "ft"; i++; }
    else if(nl === "of" && toks[i + 2] && /^\d/.test(toks[i + 2])){ n.of = parseFloat(toks[i + 2]); i += 2; }
    else if(nl === "out" && (toks[i + 2] || "").toLowerCase() === "of" && toks[i + 3] && /^\d/.test(toks[i + 3])){ n.of = parseFloat(toks[i + 3]); i += 3; }
    else if(nx && /^[a-z]/i.test(nx) && !(JOIN[nl] && toks[i + 2] && /^\d/.test(toks[i + 2])) && !levelOf(nx)){ n.u = UNITS[nl] || nl; i++; }
    out.nums.push(n);
  }
  var times = out.nums.filter(function(x){ return x.u === "s"; }), counts = out.nums.filter(function(x){ return !x.u && !x.of; });
  if(times.length === 1 && counts.length >= 1 && times[0].v > 0) out.rate = counts[0].v / times[0].v;
  return out;
}
function numText(x){ return fmt(x.v) + (x.of ? "/" + fmt(x.of) : "") + (x.u ? (x.u === "%" ? "%" : " " + x.u) : ""); }
function readText(r){
  if(r.status) return "not done";
  var parts = r.nums.map(numText);
  if(r.rate !== null) parts.push(fmt(r.rate) + "/s");
  if(r.level) parts.push(r.level);
  if(r.note) parts.push("note: " + r.note);
  return parts.join(" · ");
}
/* the number a cell is compared on: a % for "of N", else the first plain count, else the first number */
function primary(r){
  if(!r || r.status) return null;
  var of = r.nums.filter(function(x){ return x.of; })[0]; if(of) return { v: of.v / of.of * 100, u: "%" };
  var c = r.nums.filter(function(x){ return !x.u; })[0]; if(c) return { v: c.v, u: "" };
  var any = r.nums[0]; return any ? { v: any.v, u: any.u } : null;
}

/* ---------------- demo data: invented players, last week's sheet ---------------- */
function demo(){
  var players = [["Avery", "3"], ["Blake", "5"], ["Casey", "7"], ["Dakota", "8"], ["Emerson", "10"], ["Finley", "11"],
    ["Harper", "12"], ["Jordan", "14"], ["Kai", "21"], ["Logan", "23"], ["Morgan", "24"], ["Quinn", "30"]]
    .map(function(p){ return { id: uid(), name: p[0], num: p[1], nick: "" }; });
  var cols = ["Pound dribble R", "Pound dribble L", "BTL 30s", "Crossover", "3 pylon in 30s"].map(function(n){ return { id: uid(), name: n }; });
  var vals = [["72", "59", "19 in 30s", "56", "8 right, 6 left"], ["63", "77", "27 in 22.58s (lost ball)", "77", "10 right, 10 left"], ["85", "67", "N/A", "61", "7 right, 5 left"],
    ["90", "81", "31 in 30s", "70", "9 right, 8 left"], ["58", "44", "15 in 30s", "48", "6 right, 4 left"], ["", "", "", "", ""]];
  var cells = {}; cols.forEach(function(c){ cells[c.id] = {}; });
  vals.forEach(function(row, i){ row.forEach(function(v, j){ if(v) cells[cols[j].id][players[i].id] = { text: v, upd: Date.now() - 7 * 864e5 }; }); });
  var past = { id: uid(), t: String(Date.now() - 7 * 864e5), date: daysAgo(7), title: "Ball handling", playerIds: players.slice(0, 10).map(function(p){ return p.id; }), cols: cols, cells: cells };
  return { v: 2, scale: DEFAULT_SCALE.slice(), players: players, practices: [past], better: {}, cur: null };
}

/* ---------------- storage: every keystroke saves ---------------- */
var DB, UI, saveFailed = false;
function load(){
  try { var d = JSON.parse(localStorage.getItem(KEY) || "null"); if(d && d.v === 2 && Array.isArray(d.players) && Array.isArray(d.practices)) DB = d; } catch(e) {}
  if(!DB) DB = demo();
  if(!Array.isArray(DB.scale) || DB.scale.length !== 5) DB.scale = DEFAULT_SCALE.slice();
  if(!DB.better) DB.better = {};
  DB.practices.forEach(fixPractice);
  try { UI = JSON.parse(localStorage.getItem(UIKEY) || "null"); } catch(e) {}
  UI = Object.assign({ view: DB.cur ? "sheet" : "home", sel: null, sort: "order", q: "", panel: null, colQ: "", rowQ: "", histPid: null, histQ: "", np: null, undo: [], setTab: "players" }, UI || {});
  if(!Array.isArray(UI.undo)) UI.undo = [];
}
function fixPractice(p){ if(!Array.isArray(p.playerIds)) p.playerIds = []; if(!Array.isArray(p.cols)) p.cols = []; if(!p.cells) p.cells = {}; p.cols.forEach(function(c){ if(!p.cells[c.id]) p.cells[c.id] = {}; }); }
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(DB)); localStorage.setItem(UIKEY, JSON.stringify(UI)); saveFailed = false; }
  catch(e){ saveFailed = true; }
  var s = document.getElementById("stamp");
  if(s){ s.textContent = saveFailed ? "NOT SAVED: export a backup now" : "Saved " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" }); s.className = saveFailed ? "bad" : ""; }
}
function saveUI(){ try { localStorage.setItem(UIKEY, JSON.stringify(UI)); } catch(e) {} }

/* ---------------- lookups ---------------- */
function player(id){ return DB.players.filter(function(p){ return p.id === id; })[0] || null; }
function practice(){ return DB.practices.filter(function(p){ return p.id === DB.cur; })[0] || null; }
function pname(id){ var p = player(id); return p ? p.name : "?"; }
function plabel(p){ return p.name + (p.num ? " #" + p.num : ""); }
function byName(a, b){ return norm(a.name).localeCompare(norm(b.name)); }
function col(p, id){ return p.cols.filter(function(c){ return c.id === id; })[0] || null; }
function cellText(p, colId, pid){ var c = p.cells[colId] && p.cells[colId][pid]; return c ? c.text : ""; }
function byDate(a, b){ return (a.date + a.t).localeCompare(b.date + b.t); }
function matchPlayers(list, q){
  var t = norm(q).replace(/^#/, ""); if(!t) return list.slice();
  return list.filter(function(p){ return norm(p.name).indexOf(t) > -1 || norm(p.nick).indexOf(t) > -1 || String(p.num || "") === t; });
}
/* which way is better for a column (by name, across practices); auto: times lower, everything else higher */
function betterOf(name, sample){
  var b = DB.better[norm(name)]; if(b) return b;
  return sample && sample.u === "s" ? "lower" : "higher";
}
/* the same column in earlier practices, for this player: [{date, text, read}] oldest first */
function history(name, pid, before){
  var key = norm(name), out = [];
  DB.practices.slice().sort(byDate).forEach(function(p){
    if(before && (p.date + p.t) >= (before.date + before.t)) return;
    p.cols.forEach(function(c){ if(norm(c.name) !== key) return; var t = cellText(p, c.id, pid); if(t) out.push({ date: p.date, practice: p.title, text: t, read: parse(t) }); });
  });
  return out;
}
function compare(p, c, pid, r){
  var cur = primary(r); if(!cur) return null;
  var past = history(c.name, pid, p).map(function(x){ return primary(x.read); }).filter(function(x){ return x && x.u === cur.u; });
  if(!past.length) return { first: true };
  var dir = betterOf(c.name, cur), last = past[past.length - 1], diff = cur.v - last.v;
  var best = past.reduce(function(m, x){ return dir === "lower" ? Math.min(m, x.v) : Math.max(m, x.v); }, dir === "lower" ? Infinity : -Infinity);
  var pb = dir === "lower" ? cur.v < best : cur.v > best;
  var good = diff === 0 ? 0 : ((diff > 0) === (dir !== "lower") ? 1 : -1);
  return { diff: diff, u: cur.u, good: good, pb: pb };
}

/* ---------------- render, keeping focus where it was ---------------- */
function render(){
  var a = document.activeElement, fid = a && a.id, s0 = null, s1 = null;
  try { if(fid && a.selectionStart !== undefined){ s0 = a.selectionStart; s1 = a.selectionEnd; } } catch(e) {}
  var box = document.querySelector(".tablebox"), sx = box ? box.scrollLeft : 0, sy = box ? box.scrollTop : 0;
  renderHeader();
  var v = document.getElementById("view"); v.innerHTML = "";
  if(UI.view === "sheet" && !practice()) UI.view = "home";
  ({ home: viewHome, plan: viewPlan, sheet: viewSheet, players: viewPlayers, setup: viewSetup, data: viewData }[UI.view] || viewHome)(v);
  var nb = document.querySelector(".tablebox"); if(nb && box){ nb.scrollLeft = sx; nb.scrollTop = sy; }
  if(fid){ var b = document.getElementById(fid); if(b){ b.focus({ preventScroll: true }); try { if(s0 !== null) b.setSelectionRange(s0, s1); } catch(e) {} } }
  saveUI();
}
function go(view){ UI.view = view; UI.panel = null; render(); window.scrollTo(0, 0); }
function renderHeader(){

function newPlayer(line){

    left.appendChild(h("button", { class: "item", "aria-pressed": UI.histPid === pl.id ? "true" : "false", onclick: function(){ UI.histPid = pl.id; render(); } }, [plabel(pl)])); });

    if(!byCol[k]){ byCol[k] = { name: c.name, rows: [] }; order.push(k); } byCol[k].rows.push({ date: px.date, practice: px.title, text: t, read: parse(t) }); }); });

    var g = byCol[k], prims = g.rows.map(function(x){ return primary(x.read); }), u = (prims.filter(Boolean)[0] || {}).u, dir = betterOf(g.name, prims.filter(Boolean)[0]);

    var best = vals.length ? (dir === "lower" ? Math.min.apply(null, vals) : Math.max.apply(null, vals)) : null;
    var card = h("div", { class: "card", style: "margin-bottom:10px" });
    card.appendChild(h("div", { class: "row", style: "justify-content:space-between" }, [h("b", { text: g.name }),
      h("span", { class: "muted small", text: (best !== null ? "Best " + fmt(best) + (u === "%" ? "%" : u ? " " + u : "") + " · " : "") + g.rows.length + " practice" + (g.rows.length === 1 ? "" : "s") })]));

    g.rows.slice().reverse().forEach(function(x){ tbl.appendChild(h("tr", {}, [h("td", { text: x.date }), h("td", { text: x.practice }), h("td", { text: x.text }), h("td", { class: "muted", text: readText(x.read) })])); });
    card.appendChild(h("div", { class: "tablewrap" }, [tbl]));

function spark(vals, dir){
  var W = 260, H = 44, lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), sp = hi - lo || 1;
  var pts = vals.map(function(v, i){ return [8 + i * (W - 16) / (vals.length - 1), H - 8 - (v - lo) / sp * (H - 16)]; });
  var ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("class", "spark");
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Trend: " + vals.map(fmt).join(", ") + (dir === "lower" ? " (lower is better)" : ""));
  var path = document.createElementNS(ns, "polyline"); path.setAttribute("points", pts.map(function(p){ return p.join(","); }).join(" "));
  path.setAttribute("fill", "none"); path.setAttribute("stroke", "var(--accent)"); path.setAttribute("stroke-width", "2"); svg.appendChild(path);
  pts.forEach(function(p){ var c = document.createElementNS(ns, "circle"); c.setAttribute("cx", p[0]); c.setAttribute("cy", p[1]); c.setAttribute("r", "3"); c.setAttribute("fill", "var(--accent)"); svg.appendChild(c); });
  return svg;
}

function readFile(fn){ var inp = document.createElement("input"); inp.type = "file"; inp.onchange = function(){ var f = inp.files && inp.files[0]; if(!f) return; var rd = new FileReader(); rd.onload = function(){ fn(String(rd.result), f.name); }; rd.readAsText(f); }; inp.click(); }
function importStatBook(){

/* ======================= DATA: exports, backup, sheet import ======================= */
function download(name, text, type){
  try { var b = new Blob([text], { type: type }), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500); } catch(e) {}
}
function csvCell(v){ v = v === null || v === undefined ? "" : String(v); if(/^[=+\-@]/.test(v) && !/^-?\d/.test(v)) v = " " + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }

function sheetCSV(p){   // the sheet as you see it

  rows(p).forEach(function(pl){ out.push([pl.name, pl.num].concat(p.cols.map(function(c){ return cellText(p, c.id, pl.id); }))); });

}
function tidyCSV(){   // one row per cell, with what was read from it
  var out = [["date", "practice", "column", "player", "jersey", "entry", "value_1", "unit_1", "of_1", "value_2", "unit_2", "of_2", "value_3", "unit_3", "of_3", "rate_per_s", "level", "not_done", "note"]];
  DB.practices.slice().sort(byDate).forEach(function(p){ p.cols.forEach(function(c){ Object.keys(p.cells[c.id] || {}).forEach(function(pid){
    var t = p.cells[c.id][pid].text, r = parse(t), pl = player(pid), n = r.nums, row = [p.date, p.title, c.name, pl ? pl.name : "?", pl ? pl.num : "", t];
    for(var i = 0; i < 3; i++) row.push(n[i] ? fmt(n[i].v) : "", n[i] && n[i].u ? n[i].u : "", n[i] && n[i].of ? fmt(n[i].of) : "");
    row.push(r.rate !== null ? fmt(r.rate) : "", r.level, r.status ? "yes" : "", r.note); out.push(row); }); }); });

}
function parseCSV(text){
  var rows = [], row = [], f = "", q = false;
  for(var i = 0; i < text.length; i++){ var ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; }
    else if(ch === '"') q = true; else if(ch === ","){ row.push(f); f = ""; } else if(ch === "\n" || ch === "\r"){ if(ch === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; } else f += ch; }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
/* a sheet from Numbers, Excel or Google Sheets: first column player names (a "#" column is optional), first row the drill names */
function importSheet(text, fname){
  var rs = parseCSV(text.replace(/^﻿/, "")).filter(function(r){ return r.some(function(x){ return String(x).trim(); }); });
  if(rs.length < 2){ render(); flash("That sheet has no rows to bring in."); return; }
  var hdr = rs[0].map(function(x){ return String(x).trim(); }), numCol = hdr.findIndex(function(x, i){ return i > 0 && /^(#|no\.?|number|jersey)$/i.test(x); });
  var p = { id: uid(), t: String(Date.now()), date: today(), title: (fname || "Imported sheet").replace(/\.csv$/i, ""), playerIds: [], cols: [], cells: {} };
  var colIdx = []; hdr.forEach(function(x, i){ if(i === 0 || i === numCol || !x) return; var c = { id: uid(), name: x.slice(0, 60) }; p.cols.push(c); p.cells[c.id] = {}; colIdx.push([i, c]); });
  var made = 0, matched = 0;
  rs.slice(1).forEach(function(r){
    var name = String(r[0] || "").trim(); if(!name) return;
    var num = numCol > -1 ? String(r[numCol] || "").replace(/\D/g, "") : "";
    var pl = DB.players.filter(function(x){ return norm(x.name) === norm(name) || (num && x.num === num && norm(x.name).split(" ")[0] === norm(name).split(" ")[0]); })[0];

  });
  DB.practices.push(p); DB.cur = p.id; UI.sel = null; save(); go("sheet");

}
