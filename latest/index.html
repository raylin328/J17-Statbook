<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>J17 Stat Book 4.13</title>
<style>
:root{
  --page:#FAF9F6; --card:#FFFFFF; --ink:#14171A; --ink-2:#5B6169; --ink-3:#8B9198;
  --line:#E2DFD8; --line-2:#CBC7BE; --board:#16181C; --lamp:#FFB300;
  --home:#17505C; --home-soft:#E4EEF0; --away:#7A2E3B; --away-soft:#F3E5E8;
  --prac:#4A3B6B; --prac-soft:#EBE6F2; --bad:#A32D2D; --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 110px}
.hide{display:none !important}

.board{background:var(--board);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:20}
.board-in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{min-width:0}.side.r{text-align:right}
.tname{font-size:13px;color:#9AA0A6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tscore{font-size:42px;line-height:1;font-weight:500;color:var(--lamp);letter-spacing:-.02em}
.mid{text-align:center}
.per{background:#24272C;border:1px solid #34383E;color:#fff;border-radius:6px;padding:7px 10px;font-size:13px;min-height:38px}
.board-sub{max-width:820px;margin:6px auto 0;display:flex;justify-content:space-between;font-size:11px;color:#7C8288;gap:10px}
.board-title{color:#fff;font-size:15px;text-align:center;padding:2px 0}

.nav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.nav button{background:none;border:0;border-bottom:2px solid transparent;padding:12px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}

h2{font-size:18px;font-weight:500;margin:22px 0 4px;letter-spacing:-.01em}
h2:first-child{margin-top:18px}
h3{font-size:14px;font-weight:500;margin:18px 0 8px}
.sub{color:var(--ink-2);font-size:13px;margin:0 0 14px}
.row{display:flex;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label.f{display:block;font-size:13px;color:var(--ink-2);margin:0 0 5px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:8px;padding:11px 12px;min-height:var(--tap)}
textarea{min-height:70px;resize:vertical}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--home);outline-offset:2px}
.btn{background:var(--card);border:1px solid var(--line-2);border-radius:8px;padding:13px 16px;min-height:var(--tap);font-size:15px}
.btn.solid{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.btn.danger{color:var(--bad);border-color:#E4C4C4}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:8px 12px;font-size:14px;border-radius:7px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--card);border:1px solid var(--line-2);border-radius:20px;padding:9px 14px;min-height:44px;font-size:14px;display:flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--home);border-color:var(--home);color:#fff}
.chip .ck{font-size:12px;opacity:.85}

.teamtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.teamtab{border:1px solid var(--line-2);background:var(--card);border-radius:9px;padding:12px 8px;min-height:var(--tap);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teamtab[aria-pressed="true"]{color:#fff;font-weight:500}
.teamtab.h[aria-pressed="true"]{background:var(--home);border-color:var(--home)}
.teamtab.a[aria-pressed="true"]{background:var(--away);border-color:var(--away)}

.legend{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px;font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.plr{background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:10px 8px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.plr .jn{font-size:17px;font-weight:500;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plr .nm{font-size:11px;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plr .ln{font-size:11px;color:var(--ink-3);margin-top:1px}
.plr[aria-pressed="true"]{border-width:2px;padding:9px 7px}
.plr.h[aria-pressed="true"]{background:var(--home-soft);border-color:var(--home)}
.plr.a[aria-pressed="true"]{background:var(--away-soft);border-color:var(--away)}
.plr.p[aria-pressed="true"]{background:var(--prac-soft);border-color:var(--prac)}

.dock{position:sticky;bottom:0;z-index:15;margin-top:14px;background:var(--page);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.dock-hint{font-size:13px;color:var(--ink-2);text-align:center;padding:10px 0}
.who{font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.act{border:1px solid var(--line-2);background:var(--card);border-radius:9px;min-height:58px;font-size:15px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px}
.act small{font-weight:400;font-size:11px;color:var(--ink-2)}
.undo{display:flex;gap:7px;margin-top:7px}
.undo .btn{flex:1}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--ink-2);font-weight:400}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:500;border-top:2px solid var(--line-2);border-bottom:0}
.tteam{display:inline-block;padding:3px 9px;border-radius:5px;font-size:13px;font-weight:500;margin:18px 0 6px}
.tteam.h{background:var(--home-soft);color:var(--home)}
.tteam.a{background:var(--away-soft);color:var(--away)}
.tteam.p{background:var(--prac-soft);color:var(--prac)}
.dnp{color:var(--ink-3)}

.log{list-style:none;margin:10px 0 0;padding:0}
.log li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.log .meta{color:var(--ink-3);font-size:12px}
.xbtn{background:none;border:0;color:var(--bad);font-size:13px;padding:8px 6px;min-height:40px}

.empty{text-align:center;color:var(--ink-2);padding:44px 16px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:var(--board);color:#fff;padding:11px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:88vw;box-shadow:0 6px 22px rgba(0,0,0,.22)}
.note{font-size:13px;color:var(--ink-2);background:#F2F0EA;border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:12px}
.warn{background:#FBF0E4;border-color:#E8D3B4}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--line);color:var(--ink-2);margin-left:6px}
.pill.game{background:var(--home-soft);color:var(--home)}
.pill.practice{background:var(--prac-soft);color:var(--prac)}
.timer{font-size:46px;font-weight:500;text-align:center;letter-spacing:-.02em;padding:8px 0}
.viewsw{display:flex;gap:6px;margin:0 0 10px}
.viewsw .chip{min-height:38px;padding:6px 12px;font-size:13px}
.tapgrid{border-collapse:separate;border-spacing:4px;width:auto;min-width:100%}
.tapgrid th{font-size:12px;padding:4px 2px;text-align:center;color:var(--ink-2);border:0}
.tapgrid th:first-child{text-align:left}
.tapgrid td{padding:0;border:0;text-align:center}
.tapgrid .nmcell{position:sticky;left:0;z-index:2;background:var(--page);text-align:left;
  padding:0 6px 0 0;max-width:132px;min-width:96px}
.tapgrid .nmcell b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tapgrid .nmcell small{display:block;font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tapgrid .ptscell{font-size:15px;font-weight:500;min-width:40px}
.cell{width:50px;height:50px;border:1px solid var(--line-2);background:var(--card);border-radius:9px;
  font-size:17px;font-weight:500;display:flex;align-items:center;justify-content:center;padding:0}
.cell:active{transform:scale(.94)}
.cell.zero{color:var(--ink-3);font-weight:400}
.tapgrid.h .cell:active{background:var(--home-soft);border-color:var(--home)}
.tapgrid.a .cell:active{background:var(--away-soft);border-color:var(--away)}
.minus .cell{border-color:#E4C4C4;background:#FBF1F1}
.btn[aria-pressed="true"].mtog{background:var(--bad);border-color:var(--bad);color:#fff}
.clockbtn{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px auto 0;background:#24272C;
  border:1px solid #34383E;color:var(--lamp);border-radius:6px;font-size:21px;font-weight:500;padding:3px 10px;min-height:40px;min-width:92px}
.clockbtn.run{border-color:var(--lamp)}
.clockbtn .clkst{font-size:11px;color:#9AA0A6}
.clkctl{display:flex;gap:2px;justify-content:center}
.clkctl button{background:none;border:0;color:#9AA0A6;font-size:12px;padding:4px 8px;min-height:30px}
.cell.entry{border-style:dashed;font-size:13px}
.entryw{margin-top:2px}
.scalerow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-bottom:8px}
.scalerow input{min-height:44px;width:100%}
.scaleval{font-size:26px;font-weight:500;text-align:center;align-self:center}
.overlay{position:fixed;inset:0;background:rgba(20,23,26,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--page);width:100%;max-width:560px;border-radius:14px 14px 0 0;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:96vh;overflow:auto}
.btn.seg[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.court{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px;
  color:var(--ink-3);touch-action:manipulation;cursor:crosshair}
.court .mk.h{fill:var(--home)} .court .mk.a{fill:var(--away)}
.court .ms line{stroke-width:3;stroke-linecap:round}
.court .ms.h line{stroke:var(--home)} .court .ms.a line{stroke:var(--away)}
.jno{font-size:12px;color:var(--ink-2);font-weight:400;margin-right:5px}
.typetag{font-size:11px;opacity:.7}
.srow{display:grid;grid-template-columns:1fr 92px 44px;gap:8px;align-items:center;margin-bottom:8px}
.chip .pill{margin-left:0}
.chip.grp{font-weight:500}
.grphead{font-size:12px;color:var(--ink-3);margin:12px 0 6px}
.catrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.catrow .cn{flex:1;min-width:0;display:flex;align-items:center}
.catrow .cnt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .pill{flex:none}
.issues{margin:8px 0 0;padding-left:18px}
.issues li{margin:3px 0}
@media print{.noprint{display:none !important}body{background:#fff;font-size:12px}.wrap{max-width:none;padding:0}.card{border:0;padding:0}}

    /* v4.7: attempts table on practice session view */
    table.attempts { width:100%; border-collapse:collapse; font-size:14px; }
    table.attempts th, table.attempts td { padding:6px 8px; border-bottom:1px solid var(--rule, #e5e7eb); text-align:left; vertical-align:top; }

      /* v4.7.1: possessions */
    .tposs { font-size:11px; opacity:.72; margin-top:1px; }
    .possline { font-size:13px; color:var(--ink); opacity:.75; margin:6px 2px 16px; }

    .tapgrid .benchhead th { padding-top:14px; color:var(--ink-3); }
    /* v4.12.2: the full court lies down, so its sheet is wider */

    /* v4.13: shot zones */
    :root { --z1:#D9E7EA; --z2:#B0CDD3; --z3:#7FAEB7; --z4:#4F8E99; }
    .zonemap .zone { fill:#fff; fill-opacity:0; stroke:var(--line-2); stroke-width:1; stroke-dasharray:4 3; }
    .zonemap .zone.zf1 { fill:var(--z1); fill-opacity:1; } .zonemap .zone.zf2 { fill:var(--z2); fill-opacity:1; }
    .zonemap .zone.zf3 { fill:var(--z3); fill-opacity:1; } .zonemap .zone.zf4 { fill:var(--z4); fill-opacity:1; }

           -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  .finder{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 10px }

<div class="wrap">
  <nav class="nav noprint" id="nav"></nav>
  <main id="view"></main>

<script>
"use strict";
/* APP */

var KEY = "j17.statbook.v2";
var OLDKEY = "j17.statbook.v1";
var SCHEMA = 3;  // v3: typed stats, shot misses/positions, game clock
                 // v4.6 categories are additive to schema 3, NOT a bump: every version
                 // folder shares one localStorage, and older builds refuse newer schemas.
var APP_VERSION = "4.16";

/* ---------- state ---------- */
var S = null;
var UI = { tab:"session", team:0, sel:null, editStats:false, setup:null, drill:null, card:null, minus:false,
           shot:null, entry:null, shotFilter:"all", catFilter:"all", importReport:null, clearing:null , attempt:null };

/* IDs are random UUID v4: generated once, stored, never recomputed.
   `p` is kept for call-site readability; older short IDs keep working
   because the app treats every ID as opaque text.                       */
function uid(p){
  var c = (typeof crypto !== "undefined") ? crypto : null;
  if(c && typeof c.randomUUID === "function") return c.randomUUID();
  if(c && typeof c.getRandomValues === "function"){
    var b = new Uint8Array(16); c.getRandomValues(b);
    b[6] = (b[6] & 0x0f) | 0x40;   // version 4
    b[8] = (b[8] & 0x3f) | 0x80;   // RFC 4122 variant
    var h = Array.prototype.map.call(b, function(x){ return (x + 0x100).toString(16).slice(1); }).join("");
    return h.slice(0,8) + "-" + h.slice(8,12) + "-" + h.slice(12,16) + "-" + h.slice(16,20) + "-" + h.slice(20);
  }
  // no crypto at all (very old browsers): still unique in practice, just not cryptographic
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(ch){
    var r = Math.random() * 16 | 0; return (ch === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

/* ---------- stat catalog ----------
   kind: count   -> tally of occurrences (points, rebounds)
         measure -> a number; best/latest matters (vertical jump)
         time    -> a number in seconds; lower is better
   scope: game | practice
   pts:  points each occurrence adds to the score (scoring stats only)          */
function seedStats(){
  function tally(key, label, pts, on){
    return { key:key, label:label, short:key, type:"integer", tally:true, scope:"game", pts:pts || null, on:on !== false };
  }
  return [
    tally("2P","2-pointer",2), tally("3P","3-pointer",3), tally("1P","Free throw",1), tally("FTX","Free throw miss"),
    tally("OREB","Off. rebound"), tally("DREB","Def. rebound"), tally("AST","Assist"), tally("STL","Steal"),

/* ---------- data types ----------
   integer  whole number. A game integer is a tally: each tap adds one.
   float    decimal number, typed in
   time     seconds, from the stopwatch or typed in
   boolean  yes / no
   text     a free note
   scale    a number picked on a slider between min and max            */
var TYPES = [
  ["integer","Integer — whole number (in games, each tap adds 1)"],
  ["float",  "Decimal — e.g. 22.5"],
  ["time",   "Time — seconds, with a stopwatch"],
  ["boolean","Yes / No"],
  ["text",   "Text — a note"],
  ["scale",  "Scale — a slider, e.g. 1 to 10"],
  ["level",  "Level — Beginner to Elite"]          // v4.14: saved as the word, like a drill rating

// Substitution & Minutes Tracking (v4.5)
/* ---------- lineups and substitutions (v4.9) ----------
   Who is on the court is kept as a list of lineup changes per team:
     sess.lineups = [{ id, t, team, on:[player ids], period, clk }]
   Each entry is the whole lineup from that moment on; clk is the game clock
   (ms left) when it was set. Any number of players can be on: refs miss a
   sixth player and teams play short, so the count is shown, never enforced.
   Minutes come from the game clock, so they need it to have run. Plus/minus
   only needs the order of lineup changes and baskets.                        */
function lineupsFor(sess, ti){ return (sess.lineups || []).filter(function(x){ return x.team === ti; }); }
function tracksLineup(sess, ti){ return lineupsFor(sess, ti).length > 0; }
function onCourt(sess, ti){
  var l = lineupsFor(sess, ti);
  return l.length ? l[l.length - 1].on.slice() : [];
}
function setOnCourt(sess, ti, on){
  if(!sess.lineups) sess.lineups = [];
  var roster = (sess.teams[ti] && sess.teams[ti].playerIds) || [];
  var clean = on.filter(function(pid, i){ return roster.indexOf(pid) > -1 && on.indexOf(pid) === i; });
  sess.lineups.push({ id: uid("l"), t: Date.now(), team: ti, on: clean, period: sess.period,
                      clk: sess.clock ? Math.round(clockLeft(sess)) : null });
  save();
}
function toggleOnCourt(sess, ti, pid){
  var on = onCourt(sess, ti), i = on.indexOf(pid);
  if(i > -1) on.splice(i, 1); else on.push(pid);
  setOnCourt(sess, ti, on);
}
// The clock resets when the period changes: close each lineup at the old clock
// and reopen it at the new one, so no time leaks from one period into the next.
function markPeriodChange(sess, oldPeriod, oldClk){
  [0, 1].forEach(function(ti){
    if(!tracksLineup(sess, ti)) return;
    var on = onCourt(sess, ti), now = Date.now();
    sess.lineups.push({ id: uid("l"), t: now, team: ti, on: on, period: oldPeriod, clk: oldClk, mark: "end" });
    sess.lineups.push({ id: uid("l"), t: now, team: ti, on: on, period: sess.period,
                        clk: sess.clock ? sess.clock.len : null, mark: "start" });
  });
}
// seconds of game clock each player spent on the court; null if the clock never ran
function secondsOnCourt(sess, ti){
  var l = lineupsFor(sess, ti), out = {};
  if(!l.length || !(sess.clock && sess.clock.ran)) return null;
  var now = { period: sess.period, clk: Math.round(clockLeft(sess)) };
  for(var k = 0; k < l.length; k++){
    var a = l[k], b = l[k + 1] || now;
    if(a.period !== b.period || a.clk == null || b.clk == null) continue;
    var dt = (a.clk - b.clk) / 1000;
    if(dt > 0) a.on.forEach(function(pid){ out[pid] = (out[pid] || 0) + dt; });
  }
  return out;
}
// points scored minus points allowed while each player was on the court
function plusMinus(sess, ti){
  if(!tracksLineup(sess, ti)) return null;
  var out = {}, on = [];
  var items = (sess.events || []).map(function(e, i){ return { t: e.t || 0, k: 1, i: i, e: e }; })
    .concat(lineupsFor(sess, ti).map(function(x, i){ return { t: x.t || 0, k: 0, i: i, x: x }; }));
  items.sort(function(a, b){ return a.t - b.t || a.k - b.k || a.i - b.i; });
  items.forEach(function(it){
    if(it.x){ on = it.x.on; return; }
    var e = it.e, st = statByKey(e.key);
    if(!isTally(st) || !st.pts || e.miss) return;
    var t = evTeam(sess, e); if(t !== 0 && t !== 1) return;
    var pts = st.pts * evCount(e) * (t === ti ? 1 : -1);
    on.forEach(function(pid){ out[pid] = (out[pid] || 0) + pts; });
  });
  (sess.teams[ti].playerIds || []).forEach(function(pid){ if(out[pid] === undefined) out[pid] = 0; });
  return out;
}
function fmtMin(sec){ var t = Math.round(sec); return Math.floor(t / 60) + ":" + (t % 60 < 10 ? "0" : "") + (t % 60); }
function fmtPM(v){ return v > 0 ? "+" + v : String(v); }

// then the bench; roster order is kept inside each group. benchAt is where the bench
// starts (-1 when there is no split to show).
function courtOrder(sess, ti){
  var ids = (sess.teams[ti].playerIds || []).slice();
  if(!tracksLineup(sess, ti)) return { ids: ids, benchAt: -1 };
  var on = onCourt(sess, ti), a = [], t = [], b = [];
  ids.forEach(function(pid){ (on.indexOf(pid) > -1 ? a : isTeamRow(pid) ? t : b).push(pid); });
  return { ids: a.concat(t, b), benchAt: (a.length && b.length) ? a.length + t.length : -1 };
}
function courtClass(sess, ti, pid){

}
// under the team tabs: who's on, and the Subs panel
function lineupStrip(sess){
  var ti = UI.team, on = onCourt(sess, ti), tracked = tracksLineup(sess, ti);
  var wrap = el("div",{cls:"lineup"}), row = el("div",{cls:"lurow"});
  var label = function(pid){ return benchName(player(pid)); };   // "#4 Riley Park"
  row.appendChild(el("div",{cls:"lutext", text: !tracked ? "No lineup set" :
    on.length + " on court" + (on.length ? ": " + on.map(label).join(", ") : "")}));
  row.appendChild(el("button",{cls:"btn sm", "aria-pressed": UI.subs ? "true" : "false",
    text: UI.subs ? "Done" : (tracked ? "Subs" : "Set lineup"),
    on:{click:function(){ UI.subs = !UI.subs; render(); }}}));
  wrap.appendChild(row);
  if(UI.subs){
    wrap.appendChild(el("div",{cls:"sub",style:"margin:6px 0",
      text:"Tap a player to put them on or take them off. Any number can be on the court."}));
    var chips = el("div",{cls:"chips"});
    (sess.teams[ti].playerIds || []).forEach(function(pid){
      if(isTeamRow(pid)) return;
      chips.appendChild(el("button",{cls:"chip","aria-pressed": on.indexOf(pid) > -1 ? "true" : "false",
        text: label(pid), on:{click:function(){ toggleOnCourt(sess, ti, pid); render(); }}}));

function stType(st){
  if(st.type) return st.type;

}
function isTally(st){
  if(st.tally !== undefined) return !!st.tally;

  return !st.kind || st.kind === "count";           // pre-v3 stats
}
function isNumeric(st){

}
function betterOf(st){

  return { v:SCHEMA, players:[], oppTeams:[], opponents:[], stats:seedStats(), sessions:[], activeId:null, shifts:[], prefs:{ gameView:"grid", possV1:true },

function statsIn(scope, onlyOn){

/* ---------- categories (v4.6) ----------
   Every player is in exactly one category (U14 Rep, House League...).
   Miscellaneous is the default and can't be removed, so no player is ever
   without one. Seeded categories use fixed well-known ids, so every device
   and the database seed agree on them; categories made here get random
   UUIDs. Removing a category moves its players to Miscellaneous.          */
var MISC_ID = "00000000-0000-4000-8000-000000000000";
var STD_CATS = [
  ["00000000-0000-4000-8000-000000001201","U12 House League","U12","house_league"],
  ["00000000-0000-4000-8000-000000001202","U12 Rep","U12","rep"],
  ["00000000-0000-4000-8000-000000001401","U14 House League","U14","house_league"],
  ["00000000-0000-4000-8000-000000001402","U14 Rep","U14","rep"],
  ["00000000-0000-4000-8000-000000001601","U16 House League","U16","house_league"],
  ["00000000-0000-4000-8000-000000001602","U16 Rep","U16","rep"],
  ["00000000-0000-4000-8000-000000001801","U18 House League","U18","house_league"],
  ["00000000-0000-4000-8000-000000001802","U18 Rep","U18","rep"]

var MAX_CATS = 40;
function miscCat(){ return { id:MISC_ID, name:"Miscellaneous", misc:true, order:999 }; }

  return STD_CATS.map(function(c, i){ return { id:c[0], name:c[1], ageGroup:c[2], level:c[3], order:i + 1 }; })
                 .concat([miscCat()]);
}
// idempotent: runs on every load, whichever version saved the data last
function ensureCategories(d){
  if(!Array.isArray(d.categories)) d.categories = seedCategories();
  if(!d.categories.some(function(c){ return c && c.id === MISC_ID; })) d.categories.push(miscCat());
  d.categories = d.categories.filter(function(c){ return c && c.id && c.name; });
  var known = {};
  d.categories.forEach(function(c){ known[c.id] = true; });
  (d.players || []).forEach(function(p){ if(!p.cat || !known[p.cat]) p.cat = MISC_ID; });
  return d;
}
function catById(id){
  var cs = (S && S.categories) || [];
  for(var i = 0; i < cs.length; i++){ if(cs[i].id === id) return cs[i]; }
  return null;
}
function catOf(p){ return p && p.cat && catById(p.cat) ? p.cat : MISC_ID; }
function catName(id){ var c = catById(id); return c ? c.name : "Miscellaneous"; }
function catsSorted(){
  return ((S && S.categories) || []).slice().sort(function(a, b){ return (a.order || 0) - (b.order || 0); });
}
function catKey(name){
  var t = cleanText(name); if(t.normalize) t = t.normalize("NFKC");

}

}

function addCategory(name){
  var n = cleanLabel(name, 40);
  if(!n.value) return { error: "Category name is empty" };
  if(n.error) return { error: "Category name " + n.error };
  var have = findCatByName(n.value);
  if(have) return { cat: have, existed: true };
  if(S.categories.length >= MAX_CATS) return { error: "Too many categories (the limit is " + MAX_CATS + ")" };
  var order = 0;
  S.categories.forEach(function(c){ if(!c.misc && (c.order || 0) > order) order = c.order || 0; });
  var c = { id: uid("c"), name: n.value, order: order + 1 };
  S.categories.push(c);
  return { cat: c };
}
function mergeCategories(d){   // a restored backup may bring categories of its own
  var map = {};
  (d.categories || []).forEach(function(c){
    if(catById(c.id)){ map[c.id] = c.id; return; }
    var same = findCatByName(c.name);
    if(same){ map[c.id] = same.id; return; }
    if(S.categories.length >= MAX_CATS){ map[c.id] = MISC_ID; return; }
    S.categories.push(c); map[c.id] = c.id;

  (d.players || []).forEach(function(p){ p.cat = map[p.cat] || MISC_ID; });

/* ---------- drills (v4.7) ----------
   A drill is a template for a recording. Its shape decides how attempts look:
     groupSize = 1, no stages         -> one player, one value (a solo drill)
     groupSize = 1, stages = [a,b,c]  -> one player, three values (multi-stage)
     groupSize = 3, no stages         -> three players share one value (a weave)

   Attempts (sess.attempts[]) hold the actual pids and vals for one run.
   Caps stop N*M from getting out of hand.                                  */
var MAX_GROUP_SIZE = 5;
var MAX_STAGES = 4;
var MAX_VALUES = 20;
var MAX_DRILLS = 200;        // everything saved in the drill list (on or off)
var MAX_ACTIVE_DRILLS = 60;  // drills switched on at once: what practice shows
// standard drills use fixed ids so they survive rename and mean the same in the DB
var STD_DRILLS = [
  { id:"00000000-0000-4000-8000-0000000d0001", name:"Vertical jump",        short:"VERT", groupSize:1, unit:"in", better:"higher", stages:[] },
  { id:"00000000-0000-4000-8000-0000000d0002", name:"Full court sprint",    short:"FC",   groupSize:1, unit:"s",  better:"lower",  stages:[] },
  { id:"00000000-0000-4000-8000-0000000d0003", name:"Full court with ball", short:"FCB",  groupSize:1, unit:"s",  better:"lower",  stages:[] },
  { id:"00000000-0000-4000-8000-0000000d0004", name:"Lane agility",         short:"LANE", groupSize:1, unit:"s",  better:"lower",  stages:[] },
  { id:"00000000-0000-4000-8000-0000000d0005", name:"Free throws /10",      short:"FT10", groupSize:1, unit:"/10",better:"higher", stages:[] },
  { id:"00000000-0000-4000-8000-0000000d0006", name:"3-Man Weave",          short:"3MW",  groupSize:3,                              stages:[] },
  { id:"00000000-0000-4000-8000-0000000d0007", name:"Defender to Shot",     short:"D2S",  groupSize:1,
    stages:[ { name:"Beat defender",  unit:"s", better:"lower" },

];
// 3-Man Weave inherits its unit and direction from its (single) implicit stage
STD_DRILLS[5].unit = "s"; STD_DRILLS[5].better = "lower";
function seedDrills(){
  return STD_DRILLS.map(function(d, i){
    return { id:d.id, name:d.name, short:d.short, groupSize:d.groupSize, area:"Standard drills",
             unit:d.unit || null, better:d.better || null,
             stages:(d.stages || []).map(function(g){ return { name:g.name, unit:g.unit || null, better:g.better || null }; }),
             seeded:true, active:true, order:i + 1 };

function ensureDrills(d){
  if(!Array.isArray(d.drills)) d.drills = seedDrills();
  var have = {}; d.drills.forEach(function(x){ if(x && x.id) have[x.id] = x; });
  seedDrills().forEach(function(std){
    if(!have[std.id]){ d.drills.push(std); have[std.id] = std; return; }

    if(!Array.isArray(cur.stages)) cur.stages = std.stages.slice();
    if(cur.active === undefined) cur.active = true;
    if(cur.area === undefined) cur.area = std.area;   // v4.11
  });

  d.drills = d.drills.filter(function(x){ return x && x.id && x.name; });
  d.drills.forEach(function(x){
    if(!Array.isArray(x.stages)) x.stages = [];
    settleDrill(x);   // v4.8
    if(x.stages.length > MAX_STAGES) x.stages = x.stages.slice(0, MAX_STAGES);
    if(typeof x.groupSize === "number"){
      if(x.groupSize < 1) x.groupSize = 1;

/* ---------- drill measures and ratings (v4.8) ----------
   Every drill stage has a measure:

     count   a whole number, optionally within a time limit (makes in 60 s)
     makes   successes out of out_of (7 of 10)

var RATING_LEVELS = [

  { label:"Average", short:"AVG" }, { label:"Advanced", short:"ADV" }, { label:"Elite", short:"ELT" } ];

  }

}
// position on the scale, for sorting and "moved up or down" only; never averaged
function ratingRank(label){

}
// every drill states its measures and direction, so the app and its exports agree
function settleDrill(x){

}
function isBlank(v){ return v === null || v === undefined || String(v).trim() === ""; }
function stageMeasure(d, i){
  var g = (d.stages || [])[i], m = (g && g.measure) || d.measure;

}
function stageOutOf(d, i){ var g = (d.stages || [])[i]; return (g && g.outOf) || d.outOf || 10; }
function stageTimeLimit(d, i){
  var g = (d.stages || [])[i];

function unitShort(u){ return /^seconds?$/i.test(u || "") ? "s" : (u || ""); }

function stageHint(d, i){

/* ---------- drills import (v4.8) ----------

var DRILL_COLS = ["id","name","short","group_size","measure","unit","better","out_of","time_limit_s","description",
  "active","stage_number","stage_name","stage_measure","stage_unit","stage_better","stage_out_of","stage_time_limit_s","area"];

function wholeIn(v, lo, hi){ var n = Number(v); return (Math.floor(n) === n && n >= lo && n <= hi) ? n : null; }

  if(f.id && !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(f.id)) return bad("id must be a UUID");

  var better = f.better.toLowerCase();

  list.slice().sort(function(a, b){ return (a.order || 0) - (b.order || 0); }).forEach(function(d){
    var a = areaOf(d);
    if(!seen[a]){ seen[a] = []; out.push({ name: a, drills: seen[a] }); }
    seen[a].push(d);
  });
  // v4.16: areas keep their dragged order; A to Z only sorts the drills inside each one
  if(az) out.forEach(function(g){ g.drills.sort(function(a, b){ return String(a.name).toLowerCase().localeCompare(String(b.name).toLowerCase()); }); });
  return out;
}
function setDrillOn(d, on){
  if(on && !isOn(d) && activeDrillCount() >= MAX_ACTIVE_DRILLS)
    return { error: "All " + MAX_ACTIVE_DRILLS + " drills are on. Turn one off first." };
  d.active = !!on; save();

}

function addOppByNumber(sess, ti, raw){
  var side = sess.teams[ti];
  if(!side.opp) return { msg: "This side isn't an opponent team" };
  var j = cleanJersey(raw);
  if(j.error) return { msg: cap(j.error) };
  if(!j.value) return { msg: "Type the jersey number" };
  if(!S.opponents) S.opponents = [];
  var p = oppPlayersOf(side.opp).filter(function(x){ return !x.retired && x.num === j.value; })[0];
  if(p && side.playerIds.indexOf(p.id) > -1) return { msg: "#" + j.value + " is already in" };
  if(!p){
    p = { id: uid("o"), team: side.opp, num: j.value, name: "", desc: "", aliases: [], active: true };
    S.opponents.push(p);
  }
  side.playerIds.push(p.id); save();
  return { ok: true, player: p, msg: benchName(p) + " added" };
}
function dedupeIds(a){ return a.filter(function(x, i){ return a.indexOf(x) === i; }); }
function replacePid(sess, from, to){
  (sess.teams || []).forEach(function(t){ t.playerIds = dedupeIds((t.playerIds || []).map(function(x){ return x === from ? to : x; })); });
  if(sess.playerIds) sess.playerIds = dedupeIds(sess.playerIds.map(function(x){ return x === from ? to : x; }));
  (sess.events || []).forEach(function(e){ if(e.pid === from) e.pid = to; });
  (sess.lineups || []).forEach(function(l){ l.on = dedupeIds(l.on.map(function(x){ return x === from ? to : x; })); });
  (sess.attempts || []).forEach(function(a){ a.pids = a.pids.map(function(x){ return x === from ? to : x; }); });

function newOppInNumber(sess, ti, raw){

  var old = side.playerIds.map(player).filter(function(p){ return p && p.team === side.opp && p.num === j.value; })[0];
  if(!old) return { msg: "No #" + j.value + " in this game" };
  var fresh = { id: uid("o"), team: side.opp, num: j.value, name: "", desc: "", aliases: [], active: true };
  S.opponents.push(fresh); old.retired = true;

function mergeOpponents(dropId, keepId){
  var drop = player(dropId), keep = player(keepId);
  if(dropId === keepId || !drop || !keep || !drop.team || !keep.team) return false;
  S.sessions.forEach(function(x){ replacePid(x, dropId, keepId); });
  if(!keep.name && drop.name) keep.name = drop.name;
  if(!keep.desc && drop.desc) keep.desc = drop.desc;
  S.opponents = S.opponents.filter(function(x){ return x.id !== dropId; });
  save();
  return true;
}

/* ---------- derivation ---------- */
function totalsFor(sess){
  var map = {};
  function blank(){ return { n:0, miss:{} }; }
  sessionPlayerIds(sess).forEach(function(pid){ map[pid] = blank(); });
  sess.events.forEach(function(e){
    var m = map[e.pid] || (map[e.pid] = blank());
    var st = statByKey(e.key);
    m.n += 1;
    if(isTally(st)){
      if(e.miss){ m.miss[e.key] = (m.miss[e.key] || 0) + 1; return; }
      m[e.key] = (m[e.key] || 0) + (typeof e.v === "number" ? e.v : 1);
    } else {
      (m[e.key] || (m[e.key] = [])).push(e.v);
    }
  });
  return map;
}
function pointsOf(m){
  var p = 0;
  S.stats.forEach(function(s){ if(s.pts && m[s.key]) p += s.pts * m[s.key]; });
  return p;
}
function teamScore(sess, ti){
  if(sess.kind !== "game") return 0;
  var ids = (sess.teams[ti] && sess.teams[ti].playerIds) || [];
  var tot = totalsFor(sess), p = 0;
  ids.forEach(function(pid){ if(tot[pid]) p += pointsOf(tot[pid]); });
  return p;
}
function bestOf(st, arr){
  if(!arr || !arr.length) return null;
  var b = betterOf(st);
  var nums = arr.filter(function(x){ return typeof x === "number" && !isNaN(x); });
  if(b === "none" || !nums.length) return arr[arr.length - 1];
  return b === "lower" ? Math.min.apply(null, nums) : Math.max.apply(null, nums);
}
function isYes(v){ return v === true || v === "true" || v === 1 || v === "1"; }
function summarize(st, val){
  if(isTally(st)) return String(val || 0);
  if(!val || !val.length) return "—";
  if(stType(st) === "boolean"){
    return val.filter(isYes).length + "/" + val.length + " yes";
  }
  return fmtVal(st, bestOf(st, val));
}
function cellText(st, val){
  if(isTally(st)) return String(val || 0);
  if(!val || !val.length) return "–";
  var t = stType(st);
  if(t === "boolean") return val.filter(isYes).length + "✓";
  if(t === "text") return "✎" + val.length;
  if(t === "level"){ var lv = val[val.length - 1], rl = RATING_LEVELS.filter(function(x){ return x.label === lv; })[0]; return rl ? rl.short : String(lv); }
  var b = bestOf(st, val);
  return String(Math.round(Number(b) * 10) / 10);
}
function rawVal(st, v){
  if(v === null || v === undefined) return "";
  var t = stType(st);
  if(t === "boolean") return isYes(v) ? "Yes" : "No";
  return v;
}
function fmtVal(st, v){
  if(v === null || v === undefined || v === "") return "—";
  var t = stType(st);
  if(t === "boolean") return isYes(v) ? "Yes" : "No";
  if(t === "text" || t === "level") return String(v);
  var n = Math.round(Number(v) * 100) / 100;
  if(t === "scale") return n + "/" + (st.max != null ? st.max : 10);
  return n + (st.unit ? " " + st.unit : "");
}

/* ---------- dom helper ---------- */
/* ---------- v4.16: drag to rearrange ----------
   A list that can be reordered has data-sortable="<key>" and its items carry data-sid (and data-grp when an
   item may only move inside its group, like on-court vs bench). Each render registers what to do with the
   new order in SORTS[key]. Press the ≡ handle, move, let go: the items move as you go, and on release the
   new order of ids is passed on and saved. A redraw asked for mid-drag waits until you let go, and a tap on a
   handle never counts as a tap on the item it sits in. */
var SORTS = {}, DRAG = null, lastDragEnd = 0;
function sortable(box, key, sel, onDrop){ box.setAttribute("data-sortable", key); SORTS[key] = { sel: sel, onDrop: onDrop }; return box; }
function dragHandle(label){ return el("span",{cls:"dh",role:"img","aria-label":"Drag to move " + (label || "this"),title:"Drag to move"}); }   // the ≡ is drawn by the stylesheet, so it's not part of the item's text
function reorderSubset(arr, ids, idOf){
  idOf = idOf || function(x){ return x; };
  var want = {}, slots = [], byId = {};
  ids.forEach(function(id){ want[id] = true; });
  arr.forEach(function(x, i){ var id = idOf(x); if(want[id]){ slots.push(i); byId[id] = x; } });
  var items = ids.map(function(id){ return byId[id]; }).filter(function(x){ return x !== undefined; });
  if(items.length !== slots.length) return arr;
  var out = arr.slice(); slots.forEach(function(at, k){ out[at] = items[k]; }); return out;
}
document.addEventListener("pointerdown", function(e){
  var hd = e.target && e.target.closest ? e.target.closest(".dh") : null; if(!hd) return;
  var box = hd.closest("[data-sortable]"), cfg = box && SORTS[box.getAttribute("data-sortable")]; if(!cfg) return;
  var item = hd.closest(cfg.sel); if(!item || !box.contains(item)) return;
  e.preventDefault();
  DRAG = { box: box, cfg: cfg, item: item, grp: item.getAttribute("data-grp"), moved: false, pending: false, top: dragTop() };
  item.classList.add("dragging"); document.body.classList.add("dragging-on");
  try { hd.setPointerCapture(e.pointerId); } catch(x) {}
});
function dragOver(x, y){   // the item under the finger: move the dragged one next to it (same list, same group)
  if(!DRAG) return;
  var under = document.elementFromPoint ? document.elementFromPoint(x, y) : null;
  var tgt = under && under.closest ? under.closest(DRAG.cfg.sel) : null;
  if(tgt !== DRAG.last) DRAG.last = null;
  if(!tgt || tgt === DRAG.item || tgt === DRAG.last || tgt.parentNode !== DRAG.item.parentNode || !tgt.hasAttribute("data-sid")) return;
  if(tgt.getAttribute("data-grp") !== DRAG.grp) return;   // stay inside its group
  var sibs = Array.prototype.slice.call(DRAG.item.parentNode.children), a = sibs.indexOf(DRAG.item), b = sibs.indexOf(tgt);
  DRAG.item.parentNode.insertBefore(DRAG.item, a < b ? tgt.nextSibling : tgt);

function dragScroll(){   // held near the top or bottom edge: keep scrolling, faster the closer to the edge

  var edge = 80, y = DRAG.y, h = window.innerHeight, top = DRAG.top || 0, dy = 0;
  if(y < top + edge) dy = -Math.ceil((top + edge - y) / 4);

function endDrag(){

function dropGameOrder(sess, ti, ids){ sess.teams[ti].playerIds = reorderSubset(sess.teams[ti].playerIds, ids); }

function dropRoster(ids){ S.players = reorderSubset(S.players, ids, function(p){ return p.id; }); }
function dropStats(ids){ S.stats = reorderSubset(S.stats, ids, function(s){ return s.key; }); }
function dropCategories(ids){
  var sorted = catsSorted(), misc = sorted.filter(function(c){ return c.misc; })[0], at = misc ? sorted.indexOf(misc) : -1;
  var rest = sorted.filter(function(c){ return !c.misc; }).map(function(c){ return c.id; });
  var list = reorderSubset(rest, ids.filter(function(id){ return rest.indexOf(id) > -1; })).map(catById).filter(Boolean);
  if(misc) list.splice(Math.min(at, list.length), 0, misc);

}
function dropDrills(ids){   // inside one area: the same order numbers, handed out in the new sequence
  var ds = ids.map(drillById).filter(Boolean), nums = ds.map(function(d){ return d.order || 0; }).sort(function(a, b){ return a - b; });
  ds.forEach(function(d, i){ d.order = nums[i]; });
}
function dropAreas(names){
  var groups = {}; drillAreas(S.drills || [], true).forEach(function(g){ groups[g.name] = g.drills; });
  var n = 0; names.forEach(function(a){ (groups[a] || []).forEach(function(d){ d.order = ++n; }); delete groups[a]; });
  Object.keys(groups).forEach(function(a){ groups[a].forEach(function(d){ d.order = ++n; }); });

function el(tag, attrs, kids){

    else if(k === "cls") e.className = attrs[k];

/* ---------- game clock ----------
   session.clock = { len, left, since }  (ms). `since` is set while running,
   so a reload mid-game picks the clock up where real time has taken it.     */
var clockTimer = null;
function ensureClock(sess){
  if(!sess.clock){
    var len = (sess.periodMin || 8) * 60000;
    sess.clock = { len:len, left:len, since:null };
  }
  return sess.clock;
}
function clockLeft(sess){
  var c = sess.clock; if(!c) return null;
  return Math.max(0, c.since ? c.left - (Date.now() - c.since) : c.left);
}
function fmtClock(ms){
  if(ms === null || ms === undefined) return "";
  var s = Math.ceil(ms / 1000), m = Math.floor(s / 60), r = s % 60;
  return m + ":" + (r < 10 ? "0" : "") + r;
}
function clockToggle(){
  var sess = activeSession(); if(!sess || sess.kind !== "game") return;
  var c = ensureClock(sess);
  if(c.since){ c.left = clockLeft(sess); c.since = null; }
  else { if(c.left <= 0) c.left = c.len; c.since = Date.now(); c.ran = true; }   // ran: minutes can be counted
  save(); render();
}
function clockReset(){
  var sess = activeSession(); if(!sess) return;
  var c = ensureClock(sess); c.left = c.len; c.since = null;
  save(); render();
}
function clockSetTo(ms){
  var sess = activeSession(); if(!sess) return;
  var c = ensureClock(sess);
  c.left = Math.max(0, ms); if(c.since) c.since = Date.now();
  save(); render();
}
function clockPrompt(){
  var sess = activeSession(); if(!sess) return;
  var ans = window.prompt("Set the clock (m:ss)", fmtClock(clockLeft(sess) || ensureClock(sess).left));
  if(ans === null) return;
  var m = /^\s*(\d{1,2})(?::(\d{1,2}))?\s*$/.exec(ans);
  if(!m){ toast("Use m:ss — for example 5:30"); return; }
  clockSetTo((parseInt(m[1],10) * 60 + (m[2] ? parseInt(m[2],10) : 0)) * 1000);
}
function syncClock(){
  clearInterval(clockTimer); clockTimer = null;
  var sess = activeSession();
  if(!sess || !sess.clock || !sess.clock.since) return;
  clockTimer = setInterval(function(){
    var s2 = activeSession();
    if(!s2 || !s2.clock || !s2.clock.since){ clearInterval(clockTimer); clockTimer = null; return; }
    var left = clockLeft(s2);
    var f = document.getElementById("clockFace"); if(f) f.textContent = fmtClock(left);
    if(left <= 0){
      s2.clock.left = 0; s2.clock.since = null; save();
      clearInterval(clockTimer); clockTimer = null;
      toast("End of " + s2.period); render();
    }
  }, 250);
}

/* ---------- shot chart ----------
   Positions are stored as fractions of a half court (x across, y from the
   baseline), so the chart is independent of screen size.               */
/* v4.12.2: the full court. A spot is kept as two fractions in one of two frames:
     half court (the default)  x across, y down from the baseline, basket at the top;
     full court (court:"full") x across, y along the whole floor: 0 is the baseline the
                               team attacks, 1 is the baseline it defends.
   So a half-court spot on offence is the full court's attacking half (y / 2), and a
   block, which happens at the basket the team defends, is the other half turned round.
   The full court is drawn lying down, with every team attacking the basket on the right. */
function spot4(x, y){ return { x: Math.round(x * 10000) / 10000, y: Math.round(y * 10000) / 10000 }; }
function spotOnFull(e, defensive){
  if(e.court === "full") return { x: e.x, y: e.y };
  return defensive ? spot4(1 - e.x, 1 - e.y / 2) : spot4(e.x, e.y / 2);
}
// null when a full-court spot is in the half the half-court drawing doesn't show
function spotOnHalf(e, defensive){
  if(e.court !== "full") return { x: e.x, y: e.y };
  if(defensive) return e.y >= 0.5 ? spot4(1 - e.x, (1 - e.y) * 2) : null;
  return e.y <= 0.5 ? spot4(e.x, e.y * 2) : null;
}
function fullCourtSVG(dots){
  var ln = ' stroke="currentColor" stroke-width="2" fill="none"';
  var end = '<rect x="170" y="1" width="160" height="189"' + ln + '/>' +
    '<circle cx="250" cy="190" r="60"' + ln + '/>' +
    '<line x1="220" y1="40" x2="280" y2="40"' + ln + '/>' +
    '<circle cx="250" cy="52.5" r="7.5"' + ln + '/>' +
    '<path d="M210 52.5 A40 40 0 0 0 290 52.5"' + ln + '/>' +
    '<path d="M30 1 L30 140 A237.5 237.5 0 0 0 470 140 L470 1"' + ln + '/>';
  var s = '<svg class="court full" viewBox="0 0 940 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Full court">' +
    '<rect x="1" y="1" width="938" height="498"' + ln + '/>' +
    '<line x1="470" y1="1" x2="470" y2="499"' + ln + '/>' +
    '<circle cx="470" cy="250" r="60"' + ln + '/>' +
    '<g transform="matrix(0 1 -1 0 940 0)">' + end + '</g>' +      // the basket being attacked, on the right
    '<g transform="matrix(0 -1 1 0 0 500)">' + end + '</g>';       // the basket being defended, on the left

    var x = Math.round((1 - d.y) * 9400) / 10, y = Math.round(d.x * 5000) / 10;
    s += '<circle class="mk ' + d.side + '" cx="' + x + '" cy="' + y + '" r="10"/>';

}
function courtSVG(dots, full){

          halfCourtLines();   // v4.13: the same lines the zone map draws

    var x = d.x * 500, y = d.y * 470;
    if(d.miss){
      s += '<g class="ms ' + d.side + '"><line x1="' + (x-6) + '" y1="' + (y-6) + '" x2="' + (x+6) + '" y2="' + (y+6) + '"/>' +
           '<line x1="' + (x-6) + '" y1="' + (y+6) + '" x2="' + (x+6) + '" y2="' + (y-6) + '"/></g>';

/* v4.12: turnovers and blocks are charted too (a spot, with no made or missed), and an
   assist is paired with the basket it led to, so it shows where that shot was taken.
   Pairing needs no extra tap: an assist goes with the made basket a teammate scored
   just before it (or just after it, if the assist was tapped first). "Just" means the
   team's nearest tap, in the same period, within a minute. The link is the basket's
   event id, kept on the assist as e.shot; if the basket is later removed the assist
   simply counts as unpaired.                                                        */
var SPOT_KEYS = ["TO", "BLK"];
var PAIR_MS = 60000;
function isSpot(st){ return !!st && SPOT_KEYS.indexOf(st.key) > -1; }
function hasSpot(e){ return typeof e.x === "number" && typeof e.y === "number"; }
function eventById(sess, id){
  var ev = sess.events || [];
  for(var i = 0; i < ev.length; i++){ if(ev[i].id === id) return ev[i]; }
  return null;
}
function madeBasket(e){ return isShot(statByKey(e.key)) && !e.miss; }
function assistShot(sess, e){ return e.key === "AST" && e.shot ? eventById(sess, e.shot) : null; }

  var ev = sess.events || [];

  return null;
}
// called with the new event before it joins the log; returns the event it paired with
function pairAssist(sess, e){
  var isAst = e.key === "AST", isMade = madeBasket(e);
  if(!isAst && !isMade) return null;
  var ev = sess.events || [];
  for(var i = ev.length - 1; i >= 0 && i >= ev.length - 4; i--){
    var f = ev[i];
    if(f.team !== e.team) continue;                    // the other team's taps in between don't matter
    if(f.pid === e.pid || f.period !== e.period || Math.abs(e.t - f.t) > PAIR_MS) return null;
    if(isAst && madeBasket(f) && !assistFor(sess, f.id)){ e.shot = f.id; return f; }
    if(isMade && f.key === "AST" && !assistShot(sess, f)){ f.shot = e.id; return f; }
    return null;                                       // the team's nearest tap is something else
  }
  return null;
}
function assistPairs(sess){
  var out = [];
  (sess.events || []).forEach(function(e){
    var sh = assistShot(sess, e);

function chartKinds(){

/* ---------- shot zones (v4.13) ----------
   Every charted shot has a spot on the half court (x across, y down from the
   baseline, both as fractions of the drawing). From the spot the app works out:
     distance  feet from the basket;
     angle     degrees away from straight on: 0 is the middle of the floor, 90 is
               level with the basket along the baseline. Left and right are as
               you face the basket;
     zone      a named place. Close in, the drawn lines decide: inside the
               restricted arc is "At the rim", the free-throw circle is the
               "Nail", the rest of the lane is the "Paint". Further out the angle
               decides, in four bands a side: baseline, wing, slot and the middle.
               Inside the arc those are the short corner, wing midrange, elbow
               and top of the key; a three takes the same bands as the corner,
               wing, slot and top-of-the-key threes.
   Whether a shot is a three comes from the stat that was tapped (3P), not from
   the spot, so a toe on the line or a tap that's a little off can't turn a two
   into a three. With no stat to go by (tapping the map), the drawn line decides.
   Nothing is saved: zones are worked out from the spots each time, so changing a
   boundary here re-sorts every shot already charted.
   Measurements use the half-court drawing: 10 units to the foot.               */
var ZG = { w:500, h:470, bx:250, by:52.5, r3:237.5, corner:220, brk:140, lane:80, ft:190, ftr:60, ra:40 };
ZG.cy3 = ZG.brk - Math.sqrt(ZG.r3 * ZG.r3 - ZG.corner * ZG.corner);   // centre of the three-point arc as drawn
var Z_TOP = 11, Z_SLOT = 38;                                            // degrees from straight on
var Z_BASE = Math.atan2(ZG.corner, ZG.brk - ZG.by) * 180 / Math.PI;    // 68.3: the line through the break of the three-point line
var Z_MIN_SHADE = 3;                                                    // shots a zone needs before it is shaded

var ZONE_RANGES = [["rim","At the rim"],["paint","Paint"],["nail","Nail (free-throw line)"],["mid","Midrange"],["three","Threes"]];
var ZONE_BANDS = {
  c: { angle:"baseline", mid:"short corner",  three:"corner three", midShort:"Short corner", threeShort:"Corner 3" },
  w: { angle:"wing",     mid:"wing midrange", three:"wing three",   midShort:"Wing",         threeShort:"Wing 3" },
  s: { angle:"slot",     mid:"elbow",         three:"slot three",   midShort:"Elbow",        threeShort:"Slot 3" }
};
var ZONE_SECTORS = (function(){
  var b = Math.round(Z_BASE), deg = { c: b + "°+", w: Z_SLOT + "–" + b + "°", s: Z_TOP + "–" + Z_SLOT + "°" };
  var out = [];
  ["c","w","s"].forEach(function(k){
    out.push({ id:"l" + k, side:"l", band:k, name:"Left " + ZONE_BANDS[k].angle, short: cap(ZONE_BANDS[k].angle), deg:deg[k] }); });
  out.push({ id:"t", side:"m", band:"t", name:"Middle", short:"Middle", deg:"0–" + Z_TOP + "°" });
  ["s","w","c"].forEach(function(k){
    out.push({ id:"r" + k, side:"r", band:k, name:"Right " + ZONE_BANDS[k].angle, short: cap(ZONE_BANDS[k].angle), deg:deg[k] }); });
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  return out;   // left baseline round to right baseline, the way they sit on the court
})();
var ZONES = (function(){
  var out = [
    { id:"rim",   range:"rim",   name:"At the rim", short:"Rim" },
    { id:"paint", range:"paint", name:"Paint", short:"Paint" },
    { id:"nail",  range:"nail",  name:"Nail (free-throw line)", short:"Nail" }
  ];
  ["mid","three"].forEach(function(range){
    ZONE_SECTORS.forEach(function(sec){
      var b = ZONE_BANDS[sec.band];
      out.push({ id: range + "-" + sec.id, range: range, sector: sec.id,
        name: sec.band === "t" ? (range === "mid" ? "Top of the key midrange" : "Top of the key three")
                               : (sec.side === "l" ? "Left " : "Right ") + b[range],
        short: sec.band === "t" ? (range === "mid" ? "Top" : "Top 3") : b[range + "Short"] });
    });
  });
  return out;
})();
function zoneById(id){ for(var i = 0; i < ZONES.length; i++){ if(ZONES[i].id === id) return ZONES[i]; } return null; }
function sectorById(id){ for(var i = 0; i < ZONE_SECTORS.length; i++){ if(ZONE_SECTORS[i].id === id) return ZONE_SECTORS[i]; } return null; }
function rangeName(id){ for(var i = 0; i < ZONE_RANGES.length; i++){ if(ZONE_RANGES[i][0] === id) return ZONE_RANGES[i][1]; } return id; }

// where a spot is, measured from the basket
function spotGeo(x, y){
  var dx = x * ZG.w - ZG.bx, dy = y * ZG.h - ZG.by, d = Math.sqrt(dx * dx + dy * dy);
  var deg = Math.atan2(Math.abs(dx), dy) * 180 / Math.PI;
  var band = deg < Z_TOP ? "t" : deg < Z_SLOT ? "s" : deg < Z_BASE ? "w" : "c";
  var side = band === "t" ? "m" : dx < 0 ? "l" : "r";
  return { dx:dx, dy:dy, d:d, ft: Math.round(d) / 10, deg:deg, band:band, side:side, lr: dx < 0 ? "left" : "right",
           sector: band === "t" ? "t" : side + band };
}
// outside the three-point line as drawn: the straight part in the corners, the arc above them
function beyondArc(x, y){
  var px = x * ZG.w, py = y * ZG.h, dx = Math.abs(px - ZG.bx);
  if(py <= ZG.brk) return dx >= ZG.corner;
  return Math.sqrt(dx * dx + (py - ZG.cy3) * (py - ZG.cy3)) >= ZG.r3;
}
// three: true or false when the stat says so; leave it out to go by the drawn line
function zoneAt(x, y, three){
  var g = spotGeo(x, y), px = x * ZG.w, py = y * ZG.h, id;
  if(three === undefined || three === null) three = beyondArc(x, y);
  var nx = px - ZG.bx, ny = py - ZG.ft;
  if(three) id = "three-" + g.sector;
  else if(g.d <= ZG.ra || (Math.abs(g.dx) <= ZG.ra && py <= ZG.by)) id = "rim";
  else if(Math.sqrt(nx * nx + ny * ny) <= ZG.ftr) id = "nail";
  else if(Math.abs(g.dx) <= ZG.lane && py <= ZG.ft) id = "paint";
  else id = "mid-" + g.sector;
  return { id:id, zone: zoneById(id), sector: g.sector, band: g.band, side: g.side, lr: g.lr, ft: g.ft, deg: g.deg };
}
function zoneOf(e, st){
  st = st || statByKey(e.key);
  return zoneAt(e.x, e.y, ((st && st.pts) || 0) >= 3);
}
function zonable(e){ return hasSpot(e) && e.court !== "full"; }
function spotText(z){
  var ang = z.deg < 1 ? "straight on" : Math.round(z.deg) + "° " + z.lr + " of straight on";
  return z.zone.name + " · " + Math.round(z.ft) + " ft from the basket · " + ang;
}

/* ---------- which shots ---------- */
function zoneGames(){ return (S.sessions || []).filter(function(s){ return s.kind === "game"; }); }
function zoneScope(){
  var games = zoneGames(), sc = UI.zoneScope;
  if(sc === "all") return "all";
  if(sc && games.some(function(s){ return s.id === sc; })) return sc;
  var act = activeSession();
  return act && act.kind === "game" ? act.id : "all";
}
function zoneSessions(){
  var sc = zoneScope();
  return zoneGames().filter(function(s){ return sc === "all" || s.id === sc; });
}
function zoneGameName(s){
  return new Date(s.date).toLocaleDateString() + " · " + s.teams[0].name + " vs " + s.teams[1].name;
}
function zoneFilterOptions(sessions, single){
  var opts;
  if(single){
    var s = sessions[0];
    opts = [["all","Both teams"],["t0",s.teams[0].name],["t1",s.teams[1].name]];
    sessionPlayerIds(s).forEach(function(pid){ opts.push(["p:" + pid, pname(pid)]); });
    return opts;
  }
  opts = [["all","Everyone"]];
  var anyOpp = sessions.some(function(x){ return (x.teams || []).some(function(side){ return !!side.opp; }); });
  if(anyOpp){ opts.push(["ours","Our players"]); opts.push(["opp","Opponents"]); }
  var shot = {};
  sessions.forEach(function(x){ (x.events || []).forEach(function(e){ if(isShot(statByKey(e.key))) shot[e.pid] = true; }); });
  S.players.filter(function(p){ return shot[p.id]; })
    .sort(function(a, b){ return String(a.name || "").localeCompare(String(b.name || "")); })
    .forEach(function(p){ opts.push(["p:" + p.id, p.name || jersey(p) || "?"]); });
  return opts;
}
function zoneKeep(f, sess, e){
  if(f === "all") return true;
  if(f === "t0") return e.team === 0;
  if(f === "t1") return e.team === 1;
  if(f === "ours" || f === "opp"){
    var side = (sess.teams || [])[e.team], isOpp = !!(side && side.opp);
    return f === "opp" ? isOpp : !isOpp;
  }
  return e.pid === f.slice(2);
}
// every shot (2P, 3P, any stat worth 2 or more) in those games that passes the filter; z is null without a spot
function zoneShots(sessions, f){
  var out = [];
  sessions.forEach(function(sess){
    (sess.events || []).forEach(function(e){
      var st = statByKey(e.key);
      if(!isShot(st) || !zoneKeep(f, sess, e)) return;
      out.push({ e:e, sess:sess, st:st, z: zonable(e) ? zoneOf(e, st) : null });
    });
  });
  return out;
}
function zoneTally(list){
  var t = { zone:{}, sector:{}, range:{}, side:{}, all:{ att:0, made:0, pts:0 }, loose:{ att:0, made:0 } };
  function add(group, k, s){
    var c = group[k] || (group[k] = { att:0, made:0, pts:0 });
    c.att++;
    if(!s.e.miss){ c.made++; c.pts += s.st.pts || 0; }
  }
  list.forEach(function(s){
    if(!s.z){ t.loose.att++; if(!s.e.miss) t.loose.made++; return; }
    add(t.zone, s.z.id, s); add(t.sector, s.z.sector, s); add(t.range, s.z.zone.range, s); add(t.side, s.z.side, s);
    add(t, "all", s);
  });
  return t;
}
// free throws, from the games where misses were recorded (an FTX tap), so the percentage means something
function zoneFreeThrows(sessions, f){
  var out = { made:0, att:0 };
  sessions.forEach(function(sess){
    var ev = sess.events || [];
    if(!ev.some(function(e){ return e.key === "FTX"; })) return;
    ev.forEach(function(e){
      if((e.key !== "1P" && e.key !== "FTX") || !zoneKeep(f, sess, e)) return;
      out.att++; if(e.key === "1P") out.made++;

  });
  return out;
}
function zPct(c){ return c && c.att ? Math.round(c.made / c.att * 100) + "%" : "—"; }
function zPps(c){ return c && c.att ? (c.pts / c.att).toFixed(2) : "—"; }
function zShare(c, all){ return c && c.att && all && all.att ? Math.round(c.att / all.att * 100) + "%" : "—"; }
function zShade(c){
  if(!c || !c.att) return "zf0";
  if(c.att < Z_MIN_SHADE) return "zfew";
  var p = c.made / c.att;
  return p < 0.25 ? "zf1" : p < 0.4 ? "zf2" : p < 0.55 ? "zf3" : "zf4";
}

/* ---------- drawing ---------- */
function halfCourtLines(){
  var ln = ' stroke="currentColor" stroke-width="2" fill="none"';
  return '<rect x="1" y="1" width="498" height="468"' + ln + '/>' +
    '<rect x="170" y="1" width="160" height="189"' + ln + '/>' +
    '<circle cx="250" cy="190" r="60"' + ln + '/>' +
    '<line x1="220" y1="40" x2="280" y2="40"' + ln + '/>' +
    '<circle cx="250" cy="52.5" r="7.5"' + ln + '/>' +
    '<path d="M210 52.5 A40 40 0 0 0 290 52.5"' + ln + '/>' +
    '<path d="M30 1 L30 140 A237.5 237.5 0 0 0 470 140 L470 1"' + ln + '/>' +
    '<path d="M190 469 A60 60 0 0 1 310 469"' + ln + '/>';
}
// points along a line from the basket at an angle from straight on; sd is +1 for the right side, -1 for the left
function zAt(deg, sd, t){ var a = deg * Math.PI / 180; return [ZG.bx + sd * Math.sin(a) * t, ZG.by + Math.cos(a) * t]; }
function zArc(deg, sd){      // where it meets the three-point arc as drawn
  var k = ZG.by - ZG.cy3, c = Math.cos(deg * Math.PI / 180);
  return zAt(deg, sd, -k * c + Math.sqrt(k * k * c * c - k * k + ZG.r3 * ZG.r3));
}
function zEdge(deg, sd){     // where it leaves the court
  var a = deg * Math.PI / 180, sx = Math.sin(a), cy = Math.cos(a);
  var tx = sx > 1e-9 ? ZG.bx / sx : Infinity;
  var ty = cy > 1e-9 ? (ZG.h - ZG.by) / cy : cy < -1e-9 ? -ZG.by / cy : Infinity;
  return zAt(deg, sd, Math.min(tx, ty));
}
function zLane(deg, sd){ return zAt(deg, sd, ZG.lane / Math.sin(deg * Math.PI / 180)); }   // where it crosses the lane line
function zCircle(deg, sd){   // the far side of the free-throw circle
  var m = ZG.ft - ZG.by, c = Math.cos(deg * Math.PI / 180);
  return zAt(deg, sd, m * c + Math.sqrt(m * m * c * c - m * m + ZG.ftr * ZG.ftr));
}
function zp(p){ return (Math.round(p[0] * 10) / 10) + " " + (Math.round(p[1] * 10) / 10); }
// the outline of every zone and of every angle band, as SVG paths; these and zoneAt() describe the same shapes
function zoneShapes(){
  if(zoneShapes.cache) return zoneShapes.cache;
  var G = ZG, z = {}, s = {}, r3 = G.r3 + " " + G.r3 + " 0 0 ", fr = G.ftr + " " + G.ftr + " 0 0 ";
  var B = [G.bx, G.by];
  [1, -1].forEach(function(sd){
    var k = sd > 0 ? "r" : "l";
    var sw = function(f){ return sd > 0 ? f : 1 - f; };             // arcs turn the other way on the left
    var X = function(d){ return G.bx + sd * d; };
    var brk = [X(G.corner), G.brk], a38 = zArc(Z_SLOT, sd), a11 = zArc(Z_TOP, sd);
    var e68 = zEdge(Z_BASE, sd), e38 = zEdge(Z_SLOT, sd), e11 = zEdge(Z_TOP, sd);
    var l68 = zLane(Z_BASE, sd), l38 = zLane(Z_SLOT, sd), F = zCircle(Z_TOP, sd);
    z["three-" + k + "c"] = "M" + zp([X(G.corner), 0]) + "L" + zp([X(G.bx), 0]) + "L" + zp(e68) + "L" + zp(brk) + "Z";
    z["three-" + k + "w"] = "M" + zp(brk) + "L" + zp(e68) + "L" + zp(e38) + "L" + zp(a38) + "A" + r3 + sw(0) + " " + zp(brk) + "Z";
    z["three-" + k + "s"] = "M" + zp(a38) + "L" + zp(e38) + "L" + zp([X(G.bx), G.h]) + "L" + zp(e11) + "L" + zp(a11) +
                            "A" + r3 + sw(0) + " " + zp(a38) + "Z";
    z["mid-" + k + "c"] = "M" + zp([X(G.lane), 0]) + "L" + zp([X(G.corner), 0]) + "L" + zp(brk) + "L" + zp(l68) + "Z";
    z["mid-" + k + "w"] = "M" + zp(l68) + "L" + zp(brk) + "A" + r3 + sw(1) + " " + zp(a38) + "L" + zp(l38) + "Z";
    z["mid-" + k + "s"] = "M" + zp(l38) + "L" + zp(a38) + "A" + r3 + sw(1) + " " + zp(a11) + "L" + zp(F) +
                          "A" + fr + sw(0) + " " + zp([X(G.ftr), G.ft]) + "L" + zp([X(G.lane), G.ft]) + "Z";
    s[k + "c"] = "M" + zp(B) + "L" + zp(e68) + "L" + zp([X(G.bx), 0]) + "L" + zp([G.bx, 0]) + "Z";
    s[k + "w"] = "M" + zp(B) + "L" + zp(e38) + "L" + zp(e68) + "Z";
    s[k + "s"] = "M" + zp(B) + "L" + zp(e11) + "L" + zp([X(G.bx), G.h]) + "L" + zp(e38) + "Z";
  });
  z["three-t"] = "M" + zp(zArc(Z_TOP, 1)) + "L" + zp(zEdge(Z_TOP, 1)) + "L" + zp(zEdge(Z_TOP, -1)) + "L" + zp(zArc(Z_TOP, -1)) +
                 "A" + r3 + "0 " + zp(zArc(Z_TOP, 1)) + "Z";
  z["mid-t"] = "M" + zp(zCircle(Z_TOP, 1)) + "L" + zp(zArc(Z_TOP, 1)) + "A" + r3 + "1 " + zp(zArc(Z_TOP, -1)) + "L" + zp(zCircle(Z_TOP, -1)) +
               "A" + fr + "0 " + zp(zCircle(Z_TOP, 1)) + "Z";
  z.nail = "M" + (G.bx - G.ftr) + " " + G.ft + "A" + G.ftr + " " + G.ftr + " 0 1 0 " + (G.bx + G.ftr) + " " + G.ft +
           "A" + G.ftr + " " + G.ftr + " 0 1 0 " + (G.bx - G.ftr) + " " + G.ft + "Z";
  z.paint = "M" + (G.bx - G.lane) + " 0L" + (G.bx + G.lane) + " 0L" + (G.bx + G.lane) + " " + G.ft + "L" + (G.bx + G.ftr) + " " + G.ft +
            "A" + fr + "0 " + (G.bx - G.ftr) + " " + G.ft + "L" + (G.bx - G.lane) + " " + G.ft + "Z";
  z.rim = "M" + (G.bx - G.ra) + " 0L" + (G.bx + G.ra) + " 0L" + (G.bx + G.ra) + " " + G.by +
          "A" + G.ra + " " + G.ra + " 0 0 1 " + (G.bx - G.ra) + " " + G.by + "Z";
  s.t = "M" + zp(B) + "L" + zp(zEdge(Z_TOP, 1)) + "L" + zp(zEdge(Z_TOP, -1)) + "Z";
  zoneShapes.cache = { zones:z, sectors:s };
  return zoneShapes.cache;
}
// where each label sits: [x, y] or [x, y, turn] for the corner strips, which are too narrow for level text
var ZONE_LABELS = (function(){
  var right = { "mid-rc":[400,40], "mid-rw":[402,166], "mid-rs":[341,220], "three-rc":[485,76,90], "three-rw":[457,256], "three-rs":[395,393] };
  var out = { rim:[250,15], paint:[250,107], nail:[250,160], "mid-t":[250,265], "three-t":[250,345] };

var SECTOR_LABELS = { t:[250,335], rs:[402,430], rw:[455,262], rc:[410,60], ls:[98,430], lw:[45,262], lc:[90,60] };
function zoneLabel(name, cell, at){

// mode "zones" or "angles"; tally from zoneTally(); pick is the tapped spot, if any
function zoneMapSVG(mode, tally, pick){

  var lab = "";

var swStart = null, swTimer = null, swElapsed = 0;
function swNow(){ return swStart ? swElapsed + (Date.now() - swStart) : swElapsed; }
function swTick(){ var e = document.getElementById("swFace"); if(e) e.textContent = (swNow()/1000).toFixed(2); }
function swToggle(){
  if(swStart){ swElapsed = swNow(); swStart = null; clearInterval(swTimer); swTimer = null; }
  else { swStart = Date.now(); swTimer = setInterval(swTick, 50); }
  render();
}
function swReset(){ swStart = null; swElapsed = 0; clearInterval(swTimer); swTimer = null; render(); }

/* ---------- value entry, one widget per data type ---------- */
function swStop(){ swStart = null; swElapsed = 0; clearInterval(swTimer); swTimer = null; }
function stopwatchCard(st, pid, onDone){
  var card = el("div",{cls:"card"});
  card.appendChild(el("div",{cls:"timer num",id:"swFace",text:(swNow()/1000).toFixed(2)}));
  card.appendChild(el("div",{cls:"grid2"},[
    el("button",{cls:"btn",text: swStart ? "Stop" : (swElapsed ? "Resume" : "Start"),on:{click:swToggle}}),
    el("button",{cls:"btn",text:"Reset",on:{click:swReset}})
  ]));
  card.appendChild(el("div",{cls:"dock-hint",
    text: pid ? ("Recording for " + pname(pid)) : "Select a player below to record the time."}));
  if(pid && swElapsed && !swStart){
    card.appendChild(el("button",{cls:"btn solid wide",
      text:"Record " + (swElapsed/1000).toFixed(2) + "s for " + pname(pid),
      on:{click:function(){ var val = Math.round(swElapsed)/1000; swStop(); if(onDone) onDone(); record(st.key, val, pid); }}}));
  }
  if(pid){
    var inp = el("input",{type:"number",step:"any",inputmode:"decimal",placeholder:"or type the seconds"});
    var go = function(){
      var n = parseFloat(inp.value);
      if(isNaN(n) || n < 0){ toast("Enter the time in seconds"); return; }
      swStop(); if(onDone) onDone(); record(st.key, n, pid);
    };
    inp.addEventListener("keydown", function(e){ if(e.key === "Enter") go(); });
    card.appendChild(el("div",{cls:"grid2",style:"margin-top:8px"},[inp, el("button",{cls:"btn",text:"Save typed time",on:{click:go}})]));
  }
  return card;
}
function entryWidget(st, pid, onDone){
  var t = stType(st), box = el("div",{cls:"entryw"});
  function go(val){ if(onDone) onDone(); record(st.key, val, pid); }
  if(t === "time") return stopwatchCard(st, pid, onDone);
  if(t === "boolean"){
    box.appendChild(el("div",{cls:"grid2"},[
      el("button",{cls:"btn solid",text:"Yes",on:{click:function(){ go(true); }}}),
      el("button",{cls:"btn",text:"No",on:{click:function(){ go(false); }}})
    ]));
    return box;
  }
  if(t === "level"){   // v4.14: one tap on a word records it
    box.appendChild(levelChips("", function(lab){ if(lab) go(lab); }));
    return box;
  }
  if(t === "scale"){
    var lo = st.min != null ? st.min : 1, hi = st.max != null ? st.max : 10;
    var mid = Math.round((lo + hi) / 2);
    var out = el("div",{cls:"scaleval num",text:String(mid)});
    var rng = el("input",{type:"range",min:String(lo),max:String(hi),step:"1",value:String(mid),id:"pracIn","aria-label":st.label});
    rng.addEventListener("input", function(){ out.textContent = rng.value; });
    box.appendChild(el("div",{cls:"scalerow"},[el("span",{cls:"sub",style:"margin:0",text:String(lo)}), rng,
                                                el("span",{cls:"sub",style:"margin:0",text:String(hi)})]));
    box.appendChild(el("div",{cls:"grid2"},[out,
      el("button",{cls:"btn solid",text:"Record",on:{click:function(){ go(parseFloat(rng.value)); }}})]));
    return box;
  }
  var isText = (t === "text");
  var inp = el("input", isText
    ? {type:"text",id:"pracIn",placeholder:"Note"}
    : {type:"number",id:"pracIn",step: t === "integer" ? "1" : "any",
       inputmode: t === "integer" ? "numeric" : "decimal",
       placeholder: st.unit ? ("value in " + st.unit) : (t === "integer" ? "whole number" : "value")});
  var submit = function(){
    if(isText){
      var txt = inp.value.trim();
      if(!txt){ toast("Type a note first"); return; }
      go(txt); return;
    }
    var n = parseFloat(inp.value);
    if(isNaN(n)){ toast("Enter a number"); return; }
    if(t === "integer" && Math.floor(n) !== n){ toast(st.label + " takes whole numbers only"); return; }
    go(n);
  };
  inp.addEventListener("keydown", function(e){ if(e.key === "Enter") submit(); });
  box.appendChild(el("div",{cls:"grid2"},[inp, el("button",{cls:"btn solid",text:"Record",on:{click:submit}})]));
  return box;
}

/* ---------- v4.14: find players and drills during practice ---------- */
function findKey(s){   // lower case, no accents, and hyphens or dots count as spaces ("free throw" finds "Free-throw")
  s = String(s == null ? "" : s).toLowerCase(); if(s.normalize) s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return s.replace(/[\s\-_\/.]+/g, " ").trim(); }
function pracPlayers(sess){
  var q = findKey(UI.pq).replace(/^#/, ""), sort = (S.prefs && S.prefs.pracSort) || "practice";
  var ids = (sess.playerIds || []).filter(function(pid){
    var p = player(pid); if(!p) return false; if(!q) return true;
    return findKey(p.name).indexOf(q) > -1 || String(p.num || "") === q || (p.aliases || []).some(function(a){ return findKey(a).indexOf(q) > -1; });
  });
  if(sort === "az") ids.sort(function(a, b){ return findKey(pname(a)).localeCompare(findKey(pname(b))); });
  if(sort === "num") ids.sort(function(a, b){ var x = parseInt((player(a) || {}).num, 10), y = parseInt((player(b) || {}).num, 10); return (isNaN(x) ? 999 : x) - (isNaN(y) ? 999 : y); });
  return ids;
}
// dragging sets Practice order, so it's offered when that's the order on screen and no search is narrowing it
function canDragPractice(){ return !UI.pq && ((S.prefs && S.prefs.pracSort) || "practice") === "practice"; }
function pracFinder(){
  var row = el("div",{cls:"finder"});
  var q = el("input",{type:"text",id:"pracFind",enterkeyhint:"search",placeholder:"Find a player: name or number",value:UI.pq || "","aria-label":"Find a player"});
  q.addEventListener("input", function(){ UI.pq = q.value; (UI._refill || []).forEach(function(f){ f(); }); });
  row.appendChild(q);
  if(UI.pq) row.appendChild(el("button",{cls:"btn sm",text:"Clear",on:{click:function(){ UI.pq = ""; render(); }}}));
  var sort = (S.prefs && S.prefs.pracSort) || "practice";
  [["practice","Practice order"],["az","A\u2013Z"],["num","#"]].forEach(function(o){
    row.appendChild(el("button",{cls:"chip","aria-pressed": sort === o[0] ? "true" : "false",text:o[1],on:{click:function(){
      S.prefs = S.prefs || {}; S.prefs.pracSort = o[0]; save(); render(); }}}));
  });
  return row;
}
function drillMatches(list, q){
  q = findKey(q); if(!q) return list;
  return list.filter(function(d){ return [d.name, d.short, areaOf(d), d.description].some(function(x){ return findKey(x).indexOf(q) > -1; }); })
    .sort(function(a, b){ return findKey(a.name).localeCompare(findKey(b.name)); });
}

/* ---------- possessions (v4.7.1) ----------
   Counted from the event log, so there is nothing extra to tap. A possession
   ends on a made basket, a turnover, the other team's defensive rebound, or
   the last made free throw of a trip:
     possessions = made baskets + turnovers + opponent's defensive rebounds
                   + half the made free throws
   Missed free throws aren't recorded; a two-shot trip ends the possession only
   when its last shot goes in, which averages out to half the makes.
   A steal is the other team's turnover: a TO tapped next to the steal counts
   once with it, and a steal on its own still counts. Rebounds recorded before
   the offensive/defensive split count as defensive, so older games are an
   estimate. A charted miss ends nothing by itself; its rebound does.          */
function evTeam(sess, e){
  var t = e.team;
  if(t === "0" || t === "1") t = +t;
  if(t === 0 || t === 1) return t;
  var ts = sess.teams || [];
  for(var i = 0; i < ts.length; i++){ if((ts[i].playerIds || []).indexOf(e.pid) > -1) return i; }
  return null;
}
function evCount(e){ return typeof e.v === "number" && e.v > 0 ? e.v : 1; }
function possessionsFor(sess, ti){
  if(!sess || sess.kind !== "game") return null;
  var ev = sess.events || [], oi = 1 - ti, n = 0, paired = {};
  ev.forEach(function(e, i){
    var st = statByKey(e.key);
    if(!isTally(st) || e.miss) return;
    var t = evTeam(sess, e);
    if(t === ti){
      if(isShot(st)) n += evCount(e);                 // made basket
      else if(st.pts === 1) n += 0.5 * evCount(e);    // made free throw
      else if(e.key === "TO") n += evCount(e);
    } else if(t === oi){
      if(e.key === "DREB" || e.key === "REB") n += evCount(e);
      else if(e.key === "STL"){
        if(evCount(e) === 1){
          for(var d = 1; d <= 2; d++){
            var near = [i - d, i + d];
            for(var k = 0; k < 2; k++){
              var j = near[k], f = ev[j];
              if(f && f.key === "TO" && !paired[j] && evCount(f) === 1 &&
                 evTeam(sess, f) === ti && f.period === e.period){ paired[j] = true; return; }
            }
          }
        }
        n += evCount(e);                              // a steal nobody tapped a TO for
      }
    }
  });
  return n;
}

  var p = possessionsFor(sess, ti);

function reconText(sess){
  var a = sess.finalScore[0], b = sess.finalScore[1];
  if(a === null || b === null || isNaN(a) || isNaN(b)) return "Add the official score to see your capture rate.";
  var ta = teamScore(sess,0), tb = teamScore(sess,1);
  var off = a + b, got = ta + tb;
  if(!off) return "";
  var pct = Math.round(got / off * 100);
  var d1 = ta - a, d2 = tb - b;
  return "Tracked " + got + " of " + off + " points (" + pct + "%). " +
    sess.teams[0].name + " " + (d1 === 0 ? "exact" : (d1 > 0 ? "+" + d1 : String(d1))) + ", " +
    sess.teams[1].name + " " + (d2 === 0 ? "exact" : (d2 > 0 ? "+" + d2 : String(d2))) + ".";
}

// a category <select>; its last option creates a category without leaving the form
function catSelect(current, onPick){
  var s = el("select",{"aria-label":"Category"});
  var last = current;
  function fill(sel){
    s.innerHTML = "";
    catsSorted().forEach(function(c){ s.appendChild(el("option",{value:c.id,text:c.name})); });
    s.appendChild(el("option",{value:"__new",text:"+ New category\u2026"}));
    s.value = sel;
  }
  fill(current);
  s.addEventListener("change", function(){
    if(s.value !== "__new"){ last = s.value; if(onPick) onPick(last); return; }
    var name = window.prompt("New category name (like U14 Rep)");
    if(name === null || !cleanText(name)){ s.value = last; return; }
    var r = addCategory(name);
    if(r.error){ toast(r.error); s.value = last; return; }
    save();
    fill(r.cat.id); last = r.cat.id;
    if(r.existed) toast(r.cat.name + " already exists \u2014 picked it");
    if(onPick) onPick(last);
  });
  return s;
}

function importBackup(){
  var inp = document.createElement("input");
  inp.type = "file";   // no type filter (see players import)
  inp.onchange = function(){
    var f = inp.files && inp.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var d = JSON.parse(r.result);
        if(d && d.v > SCHEMA){ toast("That backup is from a newer version of the app"); return; }
        if(d && d.games && !d.sessions){ d = migrateV1(d); }
        if(!d || !d.sessions) throw new Error("bad");
        d = upgrade(d);
        mergeCategories(d);
        var havePlayers = {}; S.players.forEach(function(p){ havePlayers[p.id] = true; });
        d.players.forEach(function(p){ if(!havePlayers[p.id]) S.players.push(p); });
        var haveStats = {}; S.stats.forEach(function(s){ haveStats[s.key] = true; });
        d.stats.forEach(function(s){ if(!haveStats[s.key]) S.stats.push(s); });
        var have = {}; S.sessions.forEach(function(s){ have[s.id] = true; });
        var added = 0;
        d.sessions.forEach(function(s){ if(!have[s.id]){ S.sessions.push(s); added++; } });
        S.sessions.sort(function(a,b){ return b.date - a.date; });
        save(); render();
        toast(added + " session" + (added===1?"":"s") + " added");
      }catch(e){ toast("That file isn't a Stat Book backup"); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* A real CSV reader: quoted fields may hold commas, quotes ("") and line breaks.
   Handles CRLF from Excel and a leading byte-order mark.                     */
function parseCSVRows(text){
  text = String(text || "").replace(/^\uFEFF/, "");
  var rows = [], row = [], cell = "", q = false;
  for(var i = 0; i < text.length; i++){

      } else cell += c;

    else if(c === ","){ row.push(cell); cell = ""; }
    else if(c === "\n" || c === "\r"){

    } else cell += c;

function parseCSV(text){

  var head = rows[0].map(function(h){ return h.trim(); });
  var out = [];
  for(var i = 1; i < rows.length; i++){
    var o = {};
    head.forEach(function(h, j){ o[h] = rows[i][j] === undefined ? "" : rows[i][j].trim(); });
    out.push(o);
  }
  return out;
}

function parseValue(st, raw){

/* v4.6 players import. Columns are found by header, in any order, under the

   missing id is made here, a missing category means Miscellaneous. Existing
