var PCOLS = {
  id:      /^(id|uuid|player ?id)$/,
  name:    /^(name|player|player ?name|full ?name)$/,
  num:     /^(jersey( number| no\.?| #)?|number|num|no\.?|#)$/,
  cat:     /^(category|group|team|age ?group|division|squad)$/,
  desc:    /^(desc|description|descriptor|position|pos)$/,
  aliases: /^(aliases|alias|nicknames?|aka)$/,
  notes:   /^(notes?|comments?)$/
};
function playerCols(head){
  var at = {};
  (head || []).forEach(function(x, i){
    var k = cleanText(x).toLowerCase().replace(/[\s_]+/g, " ").trim();
    Object.keys(PCOLS).forEach(function(f){ if(at[f] === undefined && PCOLS[f].test(k)) at[f] = i; });
  });
  return at;
}
function playerById(id){
  var p = player(id);
  if(p || !UUID_RE.test(id)) return p;
  var low = id.toLowerCase();   // a UUID typed in capitals is still the same player
  for(var i = 0; i < S.players.length; i++){ if(String(S.players[i].id).toLowerCase() === low) return S.players[i]; }
  return null;
}
// "Team 1", "U14 Rep", "House League", "Group A": a heading, not a player
function looksLikeGroup(v){
  v = cleanText(v);
  return !!v && v.length <= 40 && /\b(team|squad|group|rep|house|league|u\s?\d{1,2})\b/i.test(v);
}
// A sheet with a heading row per team and its players underneath, and no
// "name" header, becomes id, name, category rows. Only used when at least one
// heading is found, so a plain list still gets the usual "no name column" help.
function sectionsToTable(rows){
  var head = rows[0] || [], idCol = -1, nameCol = -1;
  head.forEach(function(h, c){ if(/^\s*(id|uuid|player[ _]?id)\s*$/i.test(h)) idCol = c; });
  for(var c = 0; c < head.length && nameCol < 0; c++){
    if(c === idCol) continue;
    for(var i = 0; i < rows.length; i++){ if(cleanText(rows[i][c] || "")){ nameCol = c; break; } }
  }
  if(nameCol < 0) return null;
  var cat = looksLikeGroup(head[nameCol]) ? cleanText(head[nameCol]) : "";
  var out = [["id", "name", "category"]], headings = cat ? [cat] : [];
  for(var r = 1; r < rows.length; r++){
    var row = rows[r], nm = cleanText(row[nameCol] || ""), id = idCol > -1 ? cleanText(row[idCol] || "") : "";
    var other = row.some(function(x, k){ return k !== nameCol && k !== idCol && cleanText(x || ""); });
    if(!nm && !id) continue;
    if(!id && !other && looksLikeGroup(nm)){ cat = nm; headings.push(nm); continue; }
    out.push([id, nm, cat]);
  }
  if(!headings.length) return null;
  out.headings = headings;
  return out;
}
function importPlayersCSV(text){
  var rep = { added:0, updated:0, idsMade:0, toMisc:0, kept:0, catsMade:[], warnings:[], errors:[] };
  importPlayersCSV.report = rep;
  importPlayersCSV.updated = 0;
  if(text === "EXCEL"){
    rep.fatal = "This is an Excel file (.xlsx). Download it as CSV instead: File \u2192 Download \u2192 Comma-separated values.";
    toast(rep.fatal);
    return 0;
  }
  var rows = parseCSVRows(text);
  if(!rows.length){ rep.fatal = "The file is empty."; toast("The file is empty"); return 0; }
  var at = playerCols(rows[0]);
  if(at.name === undefined){   // v4.9: team headings as rows, players under them
    var sec = sectionsToTable(rows);
    if(sec){ rows = sec; at = playerCols(rows[0]); rep.warnings.push("Read the team headings as categories: " + sec.headings.join(", ")); }
  }
  if(at.name === undefined && at.id === undefined){ rep.fatal = noNameHelp(rows[0]); return 0; }
  function cell(r, f){ return at[f] === undefined || r[at[f]] === undefined ? "" : r[at[f]]; }
  var madeHere = {};   // name key -> row number, for players this file created

  for(var i = 1; i < rows.length; i++){
    var r = rows[i], line = i + 1;
    if(r.every(function(x){ return !cleanText(x); })) continue;
    var id = cleanId(cell(r, "id"));
    var who = cleanText(cell(r, "name")).slice(0, 40) || (cleanText(cell(r, "id")).slice(0, 8) || "no name");
    var tag = "Row " + line + " (" + who + "): ";
    if(id.error){ rep.errors.push(tag + id.error); continue; }
    var nm = cleanPlayerName(cell(r, "name"));
    if(nm.error){ rep.errors.push(tag + nm.error); continue; }

    var have = null;
    if(id.value) have = playerById(id.value);
    else if(nm.value){
      var k = nameKey(nm.value);
      var same = S.players.filter(function(p){ return nameKey(p.name) === k; });
      if(same.length > 1){ rep.errors.push(tag + same.length + " players already have this name. Add an id column to say which one"); continue; }
      have = same[0] || null;
      if(have && madeHere[k]) rep.warnings.push(tag + "same name as row " + madeHere[k] + ", so treated as the same player. Give them ids if they're two different people");
    }
    if(!have){
      var rest = r.filter(function(x, j){ return j !== at.id && cleanText(x); });
      if(!rest.length) continue;   // an unused template row: just an id
      if(!nm.value){ rep.errors.push(tag + "no name. A new player needs one"); continue; }
    }

    var jn = cleanJersey(cell(r, "num"));
    if(jn.error) rep.warnings.push(tag + jn.error + ", so it was left blank");
    var catId = "", rawCat = cleanText(cell(r, "cat"));
    if(rawCat && !/^null$/i.test(rawCat)){
      var found = findCatByName(rawCat);
      if(found) catId = found.id;
      else {
        var made = addCategory(rawCat);
        if(made.error) rep.warnings.push(tag + made.error + ", so it went to Miscellaneous");
        else { catId = made.cat.id; rep.catsMade.push(made.cat.name); }
      }
    }
    var desc = cleanText(cell(r, "desc"));
    if(desc.length > 80){ desc = desc.slice(0, 80); rep.warnings.push(tag + "descriptor cut to 80 characters"); }
    var nt = cleanNote(cell(r, "notes"), 1000);
    if(nt.cut) rep.warnings.push(tag + "notes cut to 1000 characters");
    var al = cleanAliases(cell(r, "aliases"));
    if(al.bad.length) rep.warnings.push(tag + "skipped alias " + al.bad.join(", ") + " (can't start with = + - or @)");
    if(al.cut) rep.warnings.push(tag + "kept the first 10 aliases");

    if(have){
      var changed = false;
      if(!have.num && jn.value){ have.num = jn.value; changed = true; }
      else if(have.num && jn.value && String(have.num) !== jn.value) rep.kept++;
      if(!have.desc && desc){ have.desc = desc; changed = true; }
      if(!have.notes && nt.value){ have.notes = nt.value; changed = true; }
      if(!(have.aliases && have.aliases.length) && al.value.length){ have.aliases = al.value; changed = true; }
      if(catId && catId !== MISC_ID){
        var cur = catOf(have);
        if(cur === MISC_ID){ have.cat = catId; changed = true; }   // Miscellaneous counts as blank
        else if(cur !== catId) rep.kept++;
      }
      if(changed) rep.updated++;
      continue;
    }
    var newId = id.value;
    if(!newId){ newId = uid("p"); rep.idsMade++; }
    if(!catId){ catId = MISC_ID; rep.toMisc++; }
    S.players.push({ id:newId, name:nm.value, desc:desc, aliases:al.value, num:jn.value,
                     notes:nt.value, active:true, cat:catId });
    if(!id.value) madeHere[nameKey(nm.value)] = line;
    rep.added++;
  }
  importPlayersCSV.updated = rep.updated;
  return rep.added;
}
/* v4.15: opponents.csv back in. Teams are made from team_id and team; players keep their ids, so old

function importOpponentsCSV(text){
  var rep = { teams: 0, players: 0, updated: 0 };

  parseCSV(text).forEach(function(row){
    var id = cleanText(row.id), tid = cleanText(row.team_id), tname = cleanText(row.team);
    if(!id || !tid) return;
    if(!oppTeamById(tid)){ S.oppTeams.push({ id: tid, name: (tname || "Opponent").slice(0, 60) }); rep.teams++; }
    var num = cleanText(row.jersey).replace(/[^0-9]/g, "").slice(0, 3), nm = cleanText(row.name).slice(0, 60), desc = cleanText(row.description).slice(0, 80);
    var have = S.opponents.filter(function(o){ return o.id === id; })[0];
    if(have){
      var ch = false;
      if(!have.num && num){ have.num = num; ch = true; }
      if(!have.name && nm){ have.name = nm; ch = true; }
      if(!have.desc && desc){ have.desc = desc; ch = true; }
      if(ch) rep.updated++;
      return;
    }
    var o = { id: id, team: tid, num: num, name: nm, desc: desc, aliases: [], active: true };
    if(row.retired === "true") o.retired = true;
    S.opponents.push(o); rep.players++;

  return rep;
}

function importFromCSVs(playerText, sessionText, eventText, statText, oppText){
  var st = statText ? importStatsCSV(statText) : 0;     // first, so values parse by the right type
  var op = oppText ? importOpponentsCSV(oppText) : { teams: 0, players: 0, updated: 0 };   // v4.15: before sessions, so games link to them
  importPlayersCSV.updated = 0; importPlayersCSV.report = null;
  var p = playerText ? importPlayersCSV(playerText) : 0;
  var pr = importPlayersCSV.report;
  if(pr && (pr.errors.length || pr.warnings.length || pr.catsMade.length || pr.idsMade)){ pr.file = "players.csv"; UI.importReport = pr; }
  var s = importSessionsCSV(sessionText || "");
  var e = importEventsCSV(eventText || "");
  S.sessions.sort(function(a, b){ return b.date - a.date; });
  if(!S.activeId && S.sessions.length) S.activeId = S.sessions[0].id;
  save();
  return { stats: st, players: p, updated: importPlayersCSV.updated || 0,
           sessions: s, events: e, orphans: importEventsCSV.orphans || 0,
           skipped: pr ? pr.errors.length : 0, oppTeams: op.teams, opponents: op.players };
}
function detectExcel(bytes){
  if(!bytes || bytes.length < 4) return false;
  var view = new Uint8Array(bytes);
  return view[0] === 0x50 && view[1] === 0x4B && view[2] === 0x03 && view[3] === 0x04;   // PK\x03\x04
}
function parseXlsx(file){
  return new Promise(function(resolve){
    var r = new FileReader();
    r.onload = function(){
      if(detectExcel(r.result)){
        resolve("EXCEL");   // signal: this is an Excel file
      } else resolve(null);
    };
    r.onerror = function(){ resolve(null); };
    r.readAsArrayBuffer(file);
  });
}
function csvKind(text){
  text = String(text || "");
  if(looksBinary(text)) return null;   // binary: an image or PDF
  var h = (parseCSVRows(text)[0] || []).map(function(x){ return x.trim(); });
  function has(){ for(var i = 0; i < arguments.length; i++) if(h.indexOf(arguments[i]) < 0) return false; return true; }
  if(has("session_id","stat_key")) return "events";
  if(has("id","kind","team1_name")) return "sessions";
  if(has("key","type","scope")) return "stats";
  if(has("id","team_id","team","jersey")) return "opponents";   // v4.15: never read as players
  if(has("id","name")) return "players";
  var at = playerCols(h);
  if(at.name !== undefined || (at.id !== undefined && Object.keys(at).length > 1)) return "players";
  return null;
}
function importCSVFiles(){
  var inp = document.createElement("input");
  inp.type = "file"; inp.multiple = true; inp.accept = ".csv,text/csv";   // v4.11: CSV files only
  inp.onchange = function(){
    var files = Array.prototype.slice.call(inp.files || []);
    if(!files.length) return;
    var texts = {}, unknown = [], left = files.length;
    function finish(){
      if(!texts.players && !texts.sessions && !texts.events && !texts.stats && !texts.opponents){
        toast("None of those look like Stat Book CSVs"); return;
      }
      var r = importFromCSVs(texts.players, texts.sessions, texts.events, texts.stats, texts.opponents);
      render();
      var msg = "Added " + r.players + " players, " + r.sessions + " sessions, " + r.events + " entries" +
                (r.stats ? ", " + r.stats + " stats" : "") +
                (r.opponents || r.oppTeams ? ", " + r.opponents + " opponents" + (r.oppTeams ? " on " + r.oppTeams + " new teams" : "") : "") +
                (r.updated ? " · filled in details for " + r.updated + " existing players" : "");
      if(r.orphans) msg += " · " + r.orphans + " entries skipped — include sessions.csv";
      if(r.skipped) msg += " · " + r.skipped + " player rows skipped — see Players";
      if(unknown.length) msg += " · ignored " + unknown.join(", ");
      toast(msg);
    }
    files.forEach(function(f){
      var rd = new FileReader();
      rd.onload = function(){ var k = csvKind(rd.result); if(k) texts[k] = rd.result; else unknown.push(f.name); if(--left === 0) finish(); };
      rd.onerror = function(){ unknown.push(f.name); if(--left === 0) finish(); };
      rd.readAsText(f);
    });
  };
  inp.click();
}
function exportAllCSVs(){
  var files = [["stats.csv", statsCSV()], ["players.csv", playersCSV()],
               ["sessions.csv", sessionsCSV()], ["events.csv", eventsCSV()],
               ["drills.csv", drillsCSV()], ["attempts.csv", attemptsCSV()],
               ["opponents.csv", opponentsCSV()]];
  // spaced out: some browsers drop downloads fired in the same instant
  files.forEach(function(f, i){
    setTimeout(function(){ download(f[0], f[1], "text/csv;charset=utf-8"); }, i * 350);
  });
  toast("Saving " + files.length + " files — allow multiple downloads if the browser asks");
}

/* ---------- boot ---------- */
load();
if(!S.activeId && S.sessions.length) S.activeId = S.sessions[0].id;
render();
document.addEventListener("keydown", function(e){
  if((e.ctrlKey || e.metaKey) && e.key === "z"){ e.preventDefault(); undoLast(); }
});
